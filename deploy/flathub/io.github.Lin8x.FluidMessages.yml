  - name: fluidmessages-web
    buildsystem: simple
    build-commands:
      - install -d "${FLATPAK_DEST}/share/fluidmessages-web/desktop"
      - cp -a server "${FLATPAK_DEST}/share/fluidmessages-web/"
      - rm -rf "${FLATPAK_DEST}/share/fluidmessages-web/server/__pycache__" "${FLATPAK_DEST}/share/fluidmessages-web/server/Dockerfile"
      - install -m 644 desktop/launcher.py "${FLATPAK_DEST}/share/fluidmessages-web/desktop/"
      - printf '#!/bin/sh\nexec python3 /app/share/fluidmessages-web/desktop/launcher.py "$@"\n' > fluidmessages-web
      - install -Dm 755 fluidmessages-web -t "${FLATPAK_DEST}/bin/"
      - install -Dm 644 desktop/linux/io.github.Lin8x.FluidMessages.desktop -t "${FLATPAK_DEST}/share/applications/"
      - install -Dm 644 desktop/linux/io.github.Lin8x.FluidMessages.metainfo.xml -t "${FLATPAK_DEST}/share/metainfo/"
      - install -Dm 644 server/icons/icon-512.png "${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/io.github.Lin8x.FluidMessages.png"
    sources:
      - type: git
        url: https://github.com/Lin8x/FluidMessages.git
        tag: v0.49.1
        commit: aec45ae6d56658083be759688644a06dbb2bfa78
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
