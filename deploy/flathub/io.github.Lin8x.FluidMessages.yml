# Flatpak manifest for FluidMessages Web, the computer app, for Flathub. The copy Flathub builds lives in the
# flathub/io.github.Lin8x.FluidMessages repository; this one is where it's maintained (see docs/development.md,
# "Linux app stores"). Flathub's update bot reads the x-checker-data below and opens a pull request there for every
# new release tag, so the tag and commit don't need updating by hand. When the Python libraries change, regenerate
# the python3-deps sources with scripts/flatpak-python-deps.
#
# Test build (needs flatpak-builder and the Flathub remote):
#   flatpak-builder --user --install --force-clean build-dir deploy/flathub/io.github.Lin8x.FluidMessages.yml
#   flatpak run io.github.Lin8x.FluidMessages --check
id: io.github.Lin8x.FluidMessages
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: fluidmessages-web
finish-args:
  # It serves the app to its own window and to your phone, on your own network.
  - --share=network
  # The small "running" window is Tk, which draws through X11 (XWayland on Wayland desktops).
  - --share=ipc
  - --socket=x11
cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/man
  - '*.a'
  - '*.la'

modules:
  # Tk for the "running" window: the Freedesktop runtime's Python doesn't include tkinter.
  - name: tcl
    subdir: unix
    config-opts: [--enable-threads, --disable-static]
    cleanup: [/bin, /lib/tclConfig.sh, /lib/tclooConfig.sh]
    post-install:
      - chmod 755 /app/lib/libtcl8.6.so
    sources:
      - type: archive
        url: https://prdownloads.sourceforge.net/tcl/tcl8.6.16-src.tar.gz
        sha256: 91cb8fa61771c63c262efb553059b7c7ad6757afa5857af6265e4b0bdc2a14a5

  - name: tk
    subdir: unix
    config-opts: [--with-tcl=/app/lib, --disable-static]
    cleanup: [/bin, /lib/tkConfig.sh]
    post-install:
      - chmod 755 /app/lib/libtk8.6.so
    sources:
      - type: archive
        url: https://prdownloads.sourceforge.net/tcl/tk8.6.16-src.tar.gz
        sha256: be9f94d3575d4b3099d84bc3c10de8994df2d7aa405208173c709cc404a7e5fe

  # Python's _tkinter module and the tkinter package, built against the Tk above. Keep the Python version the same
  # as the runtime's (python3 --version in org.freedesktop.Sdk).
  - name: python3-tkinter
    buildsystem: simple
    build-commands:
      - gcc -shared -fPIC -O2 $(python3-config --includes) -IModules -IInclude/internal -I/app/include Modules/_tkinter.c
        -L/app/lib -ltk8.6 -ltcl8.6 -o "_tkinter$(python3-config --extension-suffix)"
      - install -Dm 755 _tkinter*.so -t "${FLATPAK_DEST}/lib/python3.13/site-packages/"
      - cp -r Lib/tkinter "${FLATPAK_DEST}/lib/python3.13/site-packages/"
      - rm -rf "${FLATPAK_DEST}/lib/python3.13/site-packages/tkinter/test"
    sources:
      - type: archive
        url: https://www.python.org/ftp/python/3.13.15/Python-3.13.15.tar.xz
        sha256: 1e66a7945a48390ee4c2a4268a0e4185884059a13c4aab6d148aa208deea4a76

  # XMPP, Matrix, and OMEMO encryption libraries, the same ones as the other computer apps. Several have compiled
  # parts written in Rust (slixmpp, cryptography, pydantic-core), so these are PyPI's prebuilt wheels for Python 3.13
  # on x86_64, pinned by SHA-256.
  - name: python3-deps
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-deps --find-links="file://${PWD}" --prefix="${FLATPAK_DEST}" --no-build-isolation *.whl
