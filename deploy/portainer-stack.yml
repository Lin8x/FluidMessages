# FluidMessages Web for Portainer: Stacks → Add stack → Web editor, and paste this. Uses the published image, so nothing
# is built. Open http://localhost:8080 on the Docker host and it starts right away, no password.
# Running Portainer on a server you reach from another computer? Delete the FLUID_LOCAL_ONLY line, then open the
# app from your computer and enter the one-time setup code from the container's Logs to choose a password.
# Optional: add an environment variable FLUID_TOKEN (openssl rand -hex 32) for a fixed token for your phone or scripts.
# For your phone: delete FLUID_LOCAL_ONLY, publish both ports to your network (like "8080:8080" and "8081:8081"), and
# scan the QR code in Settings → Phone and other devices. Port 8081 is HTTPS with FluidMessages Web's own certificate.
services:
  fluidmessages:
    image: ghcr.io/lin8x/fluidmessages-web:latest
    environment:
      # Only while the port below stays 127.0.0.1: the Docker host itself opens the app without a password.
      FLUID_LOCAL_ONLY: "1"
      FLUID_TOKEN: ${FLUID_TOKEN:-}
      RCLONE_CONFIG: /data/rclone.conf
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    volumes:
      - fluid-data:/data
    restart: unless-stopped
volumes:
  fluid-data:
