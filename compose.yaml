services:
  fluidmessages:
    build: ./server
    environment:
      FLUID_TOKEN: ${FLUID_TOKEN:?Set a random pairing token in .env or Portainer}
      FLUID_BACKUP_ONEDRIVE: ${FLUID_BACKUP_ONEDRIVE:-}
      FLUID_BACKUP_DRIVE: ${FLUID_BACKUP_DRIVE:-}
      FLUID_BACKUP_S3: ${FLUID_BACKUP_S3:-}
      RCLONE_CONFIG: /data/rclone.conf
      FLUID_PROTOCOL_CONFIG: ${FLUID_PROTOCOL_CONFIG:-}
      # Optional internet protocol accounts. Accounts set here are read-only in the phone app.
      # You can also add accounts from the phone in Settings → Accounts.
      FLUID_EMAIL_ADDRESS: ${FLUID_EMAIL_ADDRESS:-}
      FLUID_EMAIL_IMAP_HOST: ${FLUID_EMAIL_IMAP_HOST:-}
      FLUID_EMAIL_SMTP_HOST: ${FLUID_EMAIL_SMTP_HOST:-}
      FLUID_EMAIL_USER: ${FLUID_EMAIL_USER:-}
      FLUID_EMAIL_PASSWORD: ${FLUID_EMAIL_PASSWORD:-}
      FLUID_EMAIL_POLL_MINUTES: ${FLUID_EMAIL_POLL_MINUTES:-}
      FLUID_MATRIX_HOMESERVER: ${FLUID_MATRIX_HOMESERVER:-}
      FLUID_MATRIX_USER: ${FLUID_MATRIX_USER:-}
      FLUID_MATRIX_TOKEN: ${FLUID_MATRIX_TOKEN:-}
      FLUID_XMPP_JID: ${FLUID_XMPP_JID:-}
      FLUID_XMPP_PASSWORD: ${FLUID_XMPP_PASSWORD:-}
      FLUID_IRC_SERVER: ${FLUID_IRC_SERVER:-}
      FLUID_IRC_PORT: ${FLUID_IRC_PORT:-}
      FLUID_IRC_NICK: ${FLUID_IRC_NICK:-}
      FLUID_IRC_SASL_PASSWORD: ${FLUID_IRC_SASL_PASSWORD:-}
      FLUID_IRC_CHANNELS: ${FLUID_IRC_CHANNELS:-}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - fluid-data:/data
    restart: unless-stopped
volumes:
  fluid-data:
