# Draft recipe for fdroiddata (https://gitlab.com/fdroid/fdroiddata), saved there as metadata/org.fluidmessages.yml.
# See docs/fdroid/README.md before submitting. The Builds entry points at v0.46.1 (the fdroid Gradle flag arrived
# in v0.45.0). Ready to submit as is: F-Droid signs its own copy (Option A).
Categories:
  - Phone & SMS
  - Messaging
License: Apache-2.0
SourceCode: https://github.com/Lin8x/FluidMessages
IssueTracker: https://github.com/Lin8x/FluidMessages/issues
Changelog: https://github.com/Lin8x/FluidMessages/releases

AuthorName: Lin8x

AutoName: FluidMessages

# GIF search opens GIPHY or Tenor, and meeting and payment links can open closed services. All are optional.
AntiFeatures:
  NonFreeNet:
    en-US: Optional GIF search and some link types use closed online services, such as GIPHY and Tenor.

RepoType: git
Repo: https://github.com/Lin8x/FluidMessages.git

# Reproducible builds: F-Droid builds the app itself, compares it with this APK, and publishes the developer's signed
# copy if they match. Needs a release-variant APK built with -Pfdroid=true and attached to each release (see README).
#Binaries: https://github.com/Lin8x/FluidMessages/releases/download/v%v/FluidMessages-%v-fdroid.apk

Builds:
  - versionName: 0.46.1
    versionCode: 55
    commit: 9fa4bf39a6131aaa1dd207bce2ee64344c617e7e
    subdir: app
    gradle:
      - yes
    # BuildConfig.FDROID = true: no update checks or downloads from GitHub; About says "Updates come from F-Droid".
    gradleprops:
      - fdroid=true

# Option A (used now): F-Droid builds and signs the app itself, so there is no AllowedAPKSigningKeys line.
# Option B (reproducible builds, later): uncomment Binaries above and this line together (see README).
#AllowedAPKSigningKeys: 2d0980ee4c11bf655482e7ee9279c6e66b56636e8e18c8ac063e1f08785df5bc

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
CurrentVersion: 0.46.1
CurrentVersionCode: 55
