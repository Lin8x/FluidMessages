<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1010" viewBox="0 0 720 1010" role="img" aria-label="An iPhone group chat called Weekend plans. Maya and Leo send blue bubbles. Sam, on Android, sends a green bubble, and Sam's reaction shows up as a sentence instead of a real reaction. Leo answers: ugh, green bubble. Android phones can do better. The texting apps just never tried.">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".15"/></filter>
    <style>
      text { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .m { opacity: 0; animation: in1 12s ease-out infinite; }
      .d1 { animation-delay: .3s; } .d2 { animation-delay: 1.1s; } .d3 { animation-delay: 2s; } .d4 { animation-delay: 3s; } .d5 { animation-delay: 4s; }
      .d1 { animation-name: in1; } .d2 { animation-name: in2; } .d3 { animation-name: in3; } .d4 { animation-name: in4; } .d5 { animation-name: in5; }
      @keyframes in1 { 0% { opacity: 0; transform: translateY(12px); } 4%, 93% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; transform: none; } }
      @keyframes in2 { 0% { opacity: 0; transform: translateY(12px); } 4%, 86% { opacity: 1; transform: none; } 89%, 100% { opacity: 0; transform: none; } }
      @keyframes in3 { 0% { opacity: 0; transform: translateY(12px); } 4%, 79% { opacity: 1; transform: none; } 82%, 100% { opacity: 0; transform: none; } }
      @keyframes in4 { 0% { opacity: 0; transform: translateY(12px); } 4%, 70% { opacity: 1; transform: none; } 73%, 100% { opacity: 0; transform: none; } }
      @keyframes in5 { 0% { opacity: 0; transform: translateY(12px); } 4%, 62% { opacity: 1; transform: none; } 65%, 100% { opacity: 0; transform: none; } }
      .shake { transform-box: fill-box; transform-origin: center; animation: shake 12s ease-in-out infinite; animation-delay: 2.2s; }
      @keyframes shake { 0%, 5%, 100% { transform: none; } 1% { transform: translateX(-6px); } 2% { transform: translateX(6px); } 3% { transform: translateX(-4px); } 4% { transform: translateX(3px); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .m { opacity: 1 !important; } }
    </style>
    <clipPath id="screen"><rect x="124" y="184" width="472" height="626" rx="36"/></clipPath>
  </defs>
  <rect width="720" height="1010" rx="32" fill="#f2f4f8"/>

  <text x="360" y="74" fill="#141820" font-size="42" font-weight="800" text-anchor="middle">“Ew, green bubble”</text>
  <text x="360" y="116" fill="#5b6070" font-size="24" text-anchor="middle">What an Android user looks like</text>
  <text x="360" y="148" fill="#5b6070" font-size="24" text-anchor="middle">in an iPhone group chat.</text>

  <!-- phone -->
  <rect x="110" y="170" width="500" height="654" rx="50" fill="#16161a" filter="url(#shadow)"/>
  <g clip-path="url(#screen)">
    <rect x="124" y="184" width="472" height="626" fill="#fff"/>
    <rect x="124" y="184" width="472" height="78" fill="#f4f5f8"/>
    <rect x="124" y="261" width="472" height="2" fill="#e1e3ea"/>
  </g>
  <text x="360" y="234" fill="#141820" font-size="26" font-weight="800" text-anchor="middle">Weekend plans</text>

  <g class="m d1">
    <text x="156" y="298" fill="#5b6070" font-size="22">Maya</text>
    <rect x="146" y="308" width="290" height="56" rx="28" fill="#1f7fd6"/>
    <text x="291" y="345" fill="#fff" font-size="24" text-anchor="middle">Beach on Saturday?</text>
  </g>
  <g class="m d2">
    <text x="156" y="402" fill="#5b6070" font-size="22">Leo</text>
    <rect x="146" y="412" width="160" height="56" rx="28" fill="#1f7fd6"/>
    <text x="226" y="449" fill="#fff" font-size="24" text-anchor="middle">Yes!! 🏖️</text>
  </g>
  <g class="m d3">
    <text x="564" y="506" fill="#5b6070" font-size="22" text-anchor="end">Sam</text>
    <g class="shake">
      <rect x="404" y="516" width="170" height="56" rx="28" fill="#1fa84a"/>
      <text x="489" y="553" fill="#fff" font-size="24" font-weight="600" text-anchor="middle">I'm in! 🔥</text>
    </g>
  </g>
  <g class="m d4">
    <rect x="160" y="598" width="400" height="50" rx="25" fill="#e9e9ee"/>
    <text x="360" y="631" fill="#5b6070" font-size="22" text-anchor="middle">Sam: Laughed at “Yes!! 🏖️”</text>
  </g>
  <g class="m d5">
    <text x="156" y="690" fill="#5b6070" font-size="22">Leo</text>
    <rect x="146" y="700" width="310" height="56" rx="28" fill="#1f7fd6"/>
    <text x="301" y="737" fill="#fff" font-size="24" text-anchor="middle">ugh, green bubble 🙄</text>
  </g>
  <rect x="300" y="788" width="120" height="6" rx="3" fill="#c9ccd6"/>

  <!-- bottom note -->
  <rect x="40" y="858" width="640" height="116" rx="26" fill="#fff" filter="url(#shadow)"/>
  <text x="360" y="906" fill="#141820" font-size="25" font-weight="800" text-anchor="middle">Android phones can do better.</text>
  <text x="360" y="944" fill="#1b8f40" font-size="25" font-weight="800" text-anchor="middle">The texting apps just never tried.</text>
</svg>
