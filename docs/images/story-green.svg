<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="A group chat on an iPhone: blue messages from iPhone friends, then Sam's green message. Friends say the green bubble broke the group, laugh that Sam's reaction shows as a sentence, and suggest moving everyone to another app. A note explains Android could do all of this; the texting apps just never did.">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".15"/></filter>
    <style>
      text { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .m { opacity: 0; animation: in 14s ease-out infinite; }
      .d1 { animation-delay: .3s; } .d2 { animation-delay: 1.3s; } .d3 { animation-delay: 2.4s; } .d4 { animation-delay: 3.6s; }
      .d5 { animation-delay: 4.8s; } .d6 { animation-delay: 6s; } .d7 { animation-delay: 7.2s; } .d8 { animation-delay: 8.6s; }
      @keyframes in { 0% { opacity: 0; transform: translateY(10px); } 3%, 92% { opacity: 1; transform: none; } 97%, 100% { opacity: 0; } }
      .shake { transform-box: fill-box; transform-origin: center; animation: shake 14s ease-in-out infinite; animation-delay: 2.4s; }
      @keyframes shake { 0%, 4%, 100% { transform: none; } 1% { transform: translateX(-4px); } 2% { transform: translateX(4px); } 3% { transform: translateX(-2px); } }
      .apps { opacity: 0; animation: in 14s ease-out infinite; animation-delay: 9.6s; }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .m, .apps { opacity: 1 !important; } }
    </style>
  </defs>
  <rect width="1200" height="480" rx="28" fill="#f2f4f8"/>

  <text x="56" y="70" fill="#1d6fd8" font-size="15" font-weight="800" letter-spacing="2">THE GREEN BUBBLE PROBLEM</text>
  <text x="56" y="114" fill="#141820" font-size="34" font-weight="800">“Ew, green bubble.”</text>
  <text x="56" y="160" fill="#454b5a" font-size="18">Text an iPhone group from Android and the chat</text>
  <text x="56" y="186" fill="#454b5a" font-size="18">falls apart: plain texts, sentences instead of hearts,</text>
  <text x="56" y="212" fill="#454b5a" font-size="18">and somehow it's the Android person's fault.</text>

  <g class="apps">
    <text x="56" y="272" fill="#141820" font-size="18" font-weight="700">So everyone gives up and moves to another app,</text>
    <text x="56" y="298" fill="#141820" font-size="18" font-weight="700">even though Android could do all of this.</text>
    <g font-size="14" font-weight="700">
      <rect x="56" y="320" width="150" height="40" rx="20" fill="#fff" stroke="#d9dde6"/><text x="131" y="345" fill="#454b5a" text-anchor="middle">“Get WhatsApp”</text>
      <rect x="216" y="320" width="150" height="40" rx="20" fill="#fff" stroke="#d9dde6"/><text x="291" y="345" fill="#454b5a" text-anchor="middle">“Join Discord”</text>
      <rect x="376" y="320" width="170" height="40" rx="20" fill="#fff" stroke="#d9dde6"/><text x="461" y="345" fill="#454b5a" text-anchor="middle">“Just get an iPhone”</text>
    </g>
    <text x="56" y="404" fill="#1b8f40" font-size="19" font-weight="800">The real fix is on the Android side. That's FluidMessages.</text>
  </g>

  <!-- iPhone group chat -->
  <g filter="url(#shadow)">
    <rect x="760" y="24" width="280" height="432" rx="40" fill="#16161a"/>
    <rect x="772" y="38" width="256" height="404" rx="30" fill="#fff"/>
  </g>
  <text x="900" y="72" fill="#141820" font-size="14" font-weight="700" text-anchor="middle">Weekend crew 🏕️</text>
  <text x="900" y="88" fill="#8a90a0" font-size="11" text-anchor="middle">4 people</text>
  <line x1="772" y1="98" x2="1028" y2="98" stroke="#eceef2"/>
  <g font-size="12.5">
    <g class="m d1"><text x="788" y="118" fill="#8a90a0" font-size="10">Jess</text><rect x="786" y="122" width="150" height="30" rx="15" fill="#e9e9ee"/><text x="800" y="142" fill="#141820">Camping this weekend?</text></g>
    <g class="m d2"><rect x="868" y="160" width="146" height="30" rx="15" fill="#0a84ff"/><text x="882" y="180" fill="#fff">I'm in! 🔥</text></g>
    <g class="m d3 shake"><text x="788" y="206" fill="#8a90a0" font-size="10">Sam</text><rect x="786" y="210" width="160" height="30" rx="15" fill="#2fb350"/><text x="800" y="230" fill="#fff">Me too, I'll drive</text></g>
    <g class="m d4"><text x="788" y="256" fill="#8a90a0" font-size="10">Jess</text><rect x="786" y="260" width="196" height="30" rx="15" fill="#e9e9ee"/><text x="800" y="280" fill="#141820">ugh green bubble 🙄</text></g>
    <g class="m d5"><text x="788" y="306" fill="#8a90a0" font-size="10">Sam</text><rect x="786" y="310" width="200" height="30" rx="15" fill="#2fb350"/><text x="800" y="330" fill="#fff">Laughed at “I'm in! 🔥”</text></g>
    <g class="m d6"><text x="788" y="356" fill="#8a90a0" font-size="10">Riley</text><rect x="786" y="360" width="214" height="30" rx="15" fill="#e9e9ee"/><text x="800" y="380" fill="#141820">why does it say “Laughed at” lol</text></g>
    <g class="m d7"><rect x="840" y="398" width="174" height="30" rx="15" fill="#0a84ff"/><text x="854" y="418" fill="#fff">let's just use WhatsApp</text></g>
  </g>
</svg>
