<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1084" viewBox="0 0 720 1084" role="img" aria-label="Five ways to chat that all land in one inbox: Texts with your phone number, Matrix group chat that no single company owns, XMPP private chat that works like email, your normal Email shown as chats, and IRC public chat rooms. All optional. Use one, or all of them.">
  <defs>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".12"/></filter>
    <style>
      text { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .d { opacity: 0; animation-duration: 10s; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
      .d0 { animation-name: f0; } @keyframes f0 { 0%, 4% { opacity: 0; transform: translateY(0); } 6% { opacity: 1; } 34% { opacity: 1; } 36%, 100% { opacity: 0; transform: translateY(645px); } }
      .d1 { animation-name: f1; } @keyframes f1 { 0%, 13% { opacity: 0; transform: translateY(0); } 15% { opacity: 1; } 38% { opacity: 1; } 40%, 100% { opacity: 0; transform: translateY(505px); } }
      .d2 { animation-name: f2; } @keyframes f2 { 0%, 22% { opacity: 0; transform: translateY(0); } 24% { opacity: 1; } 42% { opacity: 1; } 44%, 100% { opacity: 0; transform: translateY(365px); } }
      .d3 { animation-name: f3; } @keyframes f3 { 0%, 31% { opacity: 0; transform: translateY(0); } 33% { opacity: 1; } 47% { opacity: 1; } 49%, 100% { opacity: 0; transform: translateY(225px); } }
      .d4 { animation-name: f4; } @keyframes f4 { 0%, 40% { opacity: 0; transform: translateY(0); } 42% { opacity: 1; } 51% { opacity: 1; } 53%, 100% { opacity: 0; transform: translateY(85px); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <rect width="720" height="1084" rx="32" fill="#f5f6fa"/>
  <text x="360" y="66" fill="#141820" font-size="40" font-weight="800" text-anchor="middle">More than texting</text>
  <text x="360" y="108" fill="#5b6070" font-size="24" text-anchor="middle">Add other ways to chat.</text>
  <text x="360" y="140" fill="#5b6070" font-size="24" text-anchor="middle">They all land in one inbox.</text>
  <g>
    <rect x="24" y="172" width="672" height="126" rx="26" fill="#fff" filter="url(#shadow)"/>
    <rect x="44" y="197" width="76" height="76" rx="20" fill="#1fa84a"/><text x="82" y="248" font-size="38" text-anchor="middle">💬</text>
    <text x="144" y="214" fill="#141820" font-size="28" font-weight="800">Texts</text>
    <text x="144" y="248" fill="#5b6070" font-size="24">Your phone number.</text>
    <text x="144" y="278" fill="#5b6070" font-size="24">Works with every phone.</text>
  </g>
  <g>
    <rect x="24" y="312" width="672" height="126" rx="26" fill="#fff" filter="url(#shadow)"/>
    <rect x="44" y="337" width="76" height="76" rx="20" fill="#141820"/><text x="82" y="388" fill="#fff" font-size="30" font-weight="800" text-anchor="middle">[m]</text>
    <text x="144" y="354" fill="#141820" font-size="28" font-weight="800">Matrix</text>
    <text x="144" y="388" fill="#5b6070" font-size="24">Modern group chat that no</text>
    <text x="144" y="418" fill="#5b6070" font-size="24">single company owns.</text>
  </g>
  <g>
    <rect x="24" y="452" width="672" height="126" rx="26" fill="#fff" filter="url(#shadow)"/>
    <rect x="44" y="477" width="76" height="76" rx="20" fill="#6c4cdc"/><text x="82" y="528" fill="#fff" font-size="40" font-weight="800" text-anchor="middle">X</text>
    <text x="144" y="494" fill="#141820" font-size="28" font-weight="800">XMPP</text>
    <text x="144" y="528" fill="#5b6070" font-size="24">Private chat that works like</text>
    <text x="144" y="558" fill="#5b6070" font-size="24">email: pick any provider.</text>
  </g>
  <g>
    <rect x="24" y="592" width="672" height="126" rx="26" fill="#fff" filter="url(#shadow)"/>
    <rect x="44" y="617" width="76" height="76" rx="20" fill="#1f7fd6"/><text x="82" y="668" font-size="38" text-anchor="middle">✉️</text>
    <text x="144" y="634" fill="#141820" font-size="28" font-weight="800">Email</text>
    <text x="144" y="668" fill="#5b6070" font-size="24">Your normal email,</text>
    <text x="144" y="698" fill="#5b6070" font-size="24">shown as chats.</text>
  </g>
  <g>
    <rect x="24" y="732" width="672" height="126" rx="26" fill="#fff" filter="url(#shadow)"/>
    <rect x="44" y="757" width="76" height="76" rx="20" fill="#b07d00"/><text x="82" y="808" fill="#fff" font-size="44" font-weight="800" text-anchor="middle">#</text>
    <text x="144" y="774" fill="#141820" font-size="28" font-weight="800">IRC</text>
    <text x="144" y="808" fill="#5b6070" font-size="24">Big public chat rooms for</text>
    <text x="144" y="838" fill="#5b6070" font-size="24">hobbies and projects.</text>
  </g>
  <path d="M652 235 V880" stroke="#9aa0b4" stroke-width="4" stroke-dasharray="3 10" stroke-linecap="round"/>
  <rect x="24" y="880" width="672" height="78" rx="26" fill="#e7f6ec" stroke="#1fa84a" stroke-width="3"/>
  <text x="360" y="930" fill="#141820" font-size="28" font-weight="800" text-anchor="middle">📥 One inbox</text>
  <circle cx="652" cy="235" r="8" fill="#fff" stroke="#1fa84a" stroke-width="4"/><circle class="d d0" cx="652" cy="235" r="9" fill="#1fa84a"/>
  <circle cx="652" cy="375" r="8" fill="#fff" stroke="#141820" stroke-width="4"/><circle class="d d1" cx="652" cy="375" r="9" fill="#141820"/>
  <circle cx="652" cy="515" r="8" fill="#fff" stroke="#6c4cdc" stroke-width="4"/><circle class="d d2" cx="652" cy="515" r="9" fill="#6c4cdc"/>
  <circle cx="652" cy="655" r="8" fill="#fff" stroke="#1f7fd6" stroke-width="4"/><circle class="d d3" cx="652" cy="655" r="9" fill="#1f7fd6"/>
  <circle cx="652" cy="795" r="8" fill="#fff" stroke="#b07d00" stroke-width="4"/><circle class="d d4" cx="652" cy="795" r="9" fill="#b07d00"/>
  <rect x="72" y="984" width="576" height="66" rx="33" fill="#141820"/><text x="360" y="1025" fill="#fff" font-size="24" font-weight="600" text-anchor="middle">All optional. Use one, or all of them.</text>

</svg>
