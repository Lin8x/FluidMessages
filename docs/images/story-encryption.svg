<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="What encryption means. Top: a regular text travels like a postcard from your phone through the phone company's tower to your friend, and anyone along the way can read it. Bottom: an encrypted message travels sealed and scrambled, and only your friend's phone can open it.">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".14"/></filter>
    <style>
      text { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .card { animation: ride 7s ease-in-out infinite; }
      .sealed { animation-delay: 3.5s; }
      @keyframes ride { 0% { transform: translateX(0); opacity: 0; } 6% { opacity: 1; } 45% { transform: translateX(330px); } 55% { transform: translateX(330px); } 92% { opacity: 1; } 100% { transform: translateX(660px); opacity: 0; } }
      .eye { opacity: 0; transform-box: fill-box; transform-origin: center; animation: peek 7s ease-out infinite; }
      @keyframes peek { 0%, 38% { opacity: 0; transform: scale(.4); } 44%, 58% { opacity: 1; transform: scale(1); } 64%, 100% { opacity: 0; } }
      .nope { opacity: 0; transform-box: fill-box; transform-origin: center; animation: peek 7s ease-out infinite; animation-delay: 3.5s; }
      .open { opacity: 0; animation: arrive 7s ease-out infinite; animation-delay: 3.5s; }
      @keyframes arrive { 0%, 90% { opacity: 0; } 94%, 100% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .card { transform: translateX(150px); opacity: 1; } .eye, .nope { opacity: 1 !important; } }
    </style>
  </defs>
  <rect width="1200" height="440" rx="28" fill="#f5f6fa"/>
  <text x="600" y="52" fill="#141820" font-size="26" font-weight="800" text-anchor="middle">What does “encrypted” mean?</text>
  <text x="600" y="80" fill="#5b6070" font-size="16" text-anchor="middle">Scrambled on your phone, so only the person you sent it to can read it.</text>

  <!-- Row 1: regular text, a postcard -->
  <g transform="translate(0 112)">
    <rect x="40" y="0" width="1120" height="140" rx="20" fill="#fff" stroke="#f1d3d3"/>
    <text x="70" y="34" fill="#b3261e" font-size="15" font-weight="800">REGULAR TEXT · A POSTCARD</text>
    <text x="70" y="58" fill="#5b6070" font-size="13">Anyone handling it can read it.</text>
    <g font-size="12" fill="#5b6070" text-anchor="middle">
      <rect x="120" y="70" width="40" height="58" rx="8" fill="#16161a"/><rect x="124" y="76" width="32" height="46" rx="5" fill="#e9fbee"/><text x="140" y="140">You</text>
      <path d="M592 74 l14 52 h-28 z M584 98 h16" fill="none" stroke="#5b6070" stroke-width="3" stroke-linejoin="round"/><text x="592" y="140">Phone company</text>
      <rect x="1040" y="70" width="40" height="58" rx="8" fill="#16161a"/><rect x="1044" y="76" width="32" height="46" rx="5" fill="#eef4ff"/><text x="1060" y="140">Your friend</text>
    </g>
    <line x1="180" y1="100" x2="1020" y2="100" stroke="#e3e5ec" stroke-width="2" stroke-dasharray="4 8"/>
    <g class="card"><rect x="190" y="80" width="150" height="40" rx="6" fill="#fff8e6" stroke="#e0c27a"/><text x="200" y="98" fill="#141820" font-size="11">Meet at 7, door code</text><text x="200" y="113" fill="#141820" font-size="11" font-weight="700">4821</text></g>
    <g class="eye"><circle cx="640" cy="60" r="18" fill="#fde8e7"/><text x="640" y="66" font-size="18" text-anchor="middle">👀</text></g>
  </g>

  <!-- Row 2: encrypted, a sealed envelope -->
  <g transform="translate(0 272)">
    <rect x="40" y="0" width="1120" height="140" rx="20" fill="#fff" stroke="#cdebd6"/>
    <text x="70" y="34" fill="#1b8f40" font-size="15" font-weight="800">ENCRYPTED · A SEALED LETTER</text>
    <text x="70" y="58" fill="#5b6070" font-size="13">Only your friend's phone can open it.</text>
    <g font-size="12" fill="#5b6070" text-anchor="middle">
      <rect x="120" y="70" width="40" height="58" rx="8" fill="#16161a"/><rect x="124" y="76" width="32" height="46" rx="5" fill="#e9fbee"/><text x="140" y="140">You</text>
      <path d="M592 74 l14 52 h-28 z M584 98 h16" fill="none" stroke="#5b6070" stroke-width="3" stroke-linejoin="round"/><text x="592" y="140">Phone company</text>
      <rect x="1040" y="70" width="40" height="58" rx="8" fill="#16161a"/><rect x="1044" y="76" width="32" height="46" rx="5" fill="#eef4ff"/><text x="1060" y="140">Your friend</text>
    </g>
    <line x1="180" y1="100" x2="1020" y2="100" stroke="#e3e5ec" stroke-width="2" stroke-dasharray="4 8"/>
    <g class="card sealed"><rect x="190" y="80" width="150" height="40" rx="6" fill="#e9fbee" stroke="#7cc995"/><text x="200" y="98" fill="#1b8f40" font-size="11" font-family="monospace">x9#Qa!7mR2@kz…</text><text x="200" y="113" fill="#1b8f40" font-size="11">🔒 sealed</text></g>
    <g class="nope"><circle cx="640" cy="60" r="18" fill="#e9fbee"/><text x="640" y="66" font-size="18" text-anchor="middle">🤷</text></g>
    <g class="open"><rect x="920" y="18" width="200" height="34" rx="17" fill="#1b8f40"/><text x="1020" y="40" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">Opened: “Meet at 7…”</text></g>
  </g>
</svg>
