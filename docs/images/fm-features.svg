<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-label="The missing features, on every service. Four chats: a text with Maya, a Matrix group, an email with Leah, and an IRC channel. On each one, a reaction pops onto the message and Reply and Forward show up. Each chat also gets a lock that says how private it is: the text is red, not locked; the Matrix group is green, locked; the email and IRC chats are yellow, locked on the way.">
  <defs>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".12"/></filter>
    <style>
      text { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .pop { transform-box: fill-box; transform-origin: center; }
      .a0 { animation: ka0 10s ease-out infinite; }
@keyframes ka0 { 0%, 10% { opacity: 0; transform: scale(.2); } 14%, 92% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; transform: none; } }
      .a1 { animation: ka1 10s ease-out infinite; }
@keyframes ka1 { 0%, 14% { opacity: 0; transform: translateX(-10px); } 18%, 92% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; transform: none; } }
      .a2 { animation: ka2 10s ease-out infinite; }
@keyframes ka2 { 0%, 18% { opacity: 0; transform: scale(.6); } 22%, 92% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; transform: none; } }
      .a3 { animation: ka3 10s ease-out infinite; }
@keyframes ka3 { 0%, 26% { opacity: 0; transform: scale(.2); } 30%, 92% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; transform: none; } }
      .a4 { animation: ka4 10s ease-out infinite; }
@keyframes ka4 { 0%, 30% { opacity: 0; transform: translateX(-10px); } 34%, 92% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; transform: none; } }
      .a5 { animation: ka5 10s ease-out infinite; }
@keyframes ka5 { 0%, 34% { opacity: 0; transform: scale(.6); } 38%, 92% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; transform: none; } }
      .a6 { animation: ka6 10s ease-out infinite; }
@keyframes ka6 { 0%, 42% { opacity: 0; transform: scale(.2); } 46%, 92% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; transform: none; } }
      .a7 { animation: ka7 10s ease-out infinite; }
@keyframes ka7 { 0%, 46% { opacity: 0; transform: translateX(-10px); } 50%, 92% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; transform: none; } }
      .a8 { animation: ka8 10s ease-out infinite; }
@keyframes ka8 { 0%, 50% { opacity: 0; transform: scale(.6); } 54%, 92% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; transform: none; } }
      .a9 { animation: ka9 10s ease-out infinite; }
@keyframes ka9 { 0%, 58% { opacity: 0; transform: scale(.2); } 62%, 92% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; transform: none; } }
      .a10 { animation: ka10 10s ease-out infinite; }
@keyframes ka10 { 0%, 62% { opacity: 0; transform: translateX(-10px); } 66%, 92% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; transform: none; } }
      .a11 { animation: ka11 10s ease-out infinite; }
@keyframes ka11 { 0%, 66% { opacity: 0; transform: scale(.6); } 70%, 92% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; transform: none; } }
      @media (prefers-reduced-motion: reduce) { .a0, .a1, .a2, .a3, .a4, .a5, .a6, .a7, .a8, .a9, .a10, .a11 { animation: none !important; opacity: 1 !important; transform: none !important; }  }
    </style>
  </defs>
  <rect width="720" height="720" rx="32" fill="#f2f4f8"/>
  <text x="360" y="62" fill="#141820" font-size="36" font-weight="800" text-anchor="middle">The missing features, everywhere</text>
  <text x="360" y="100" fill="#5b6070" font-size="22" text-anchor="middle">Replies, reactions, and forwarding on every service.</text>
  <rect x="24" y="128" width="672" height="128" rx="26" fill="#fff" filter="url(#shadow)"/>
  <text x="48" y="166" fill="#8a8f9c" font-size="17" font-weight="800" letter-spacing="1.2">TEXT (SMS) WITH MAYA</text>
  <rect x="48" y="186" width="187" height="46" rx="23.0" fill="#e1e4ea"/><text x="141.60000000000002" y="216.2" fill="#141820" font-size="20" text-anchor="middle">Coffee at ten?</text>
  <g class="pop a0"><circle cx="227" cy="234" r="15" fill="#fff" stroke="#e0567a" stroke-width="2"/><text x="227.20000000000002" y="240" font-size="15" text-anchor="middle">👍</text></g>
  <g class="a1"><rect x="261" y="194" width="89" height="30" rx="15" fill="#eef8f1" stroke="#bfe5cb"/><text x="305.80000000000007" y="214" fill="#1b8f40" font-size="16" font-weight="700" text-anchor="middle">↩ Reply</text><rect x="360" y="194" width="108" height="30" rx="15" fill="#eef8f1" stroke="#bfe5cb"/><text x="414.6" y="214" fill="#1b8f40" font-size="16" font-weight="700" text-anchor="middle">↪ Forward</text></g>
  <g class="pop a2"><rect x="526.0" y="144" width="146" height="36" rx="18.0" fill="#d32f2f"/><g transform="translate(540.0 152.4) scale(0.8)"><path d="M10 11V6a5 5 0 0 1 10 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><rect x="0" y="11" width="16" height="13" rx="3" fill="#fff"/></g><text x="564.0" y="167.76" fill="#fff" font-size="16" font-weight="700">Not locked</text></g>
  <rect x="24" y="274" width="672" height="128" rx="26" fill="#fff" filter="url(#shadow)"/>
  <text x="48" y="312" fill="#8a8f9c" font-size="17" font-weight="800" letter-spacing="1.2">MATRIX · BOOK CLUB</text>
  <rect x="48" y="332" width="252" height="46" rx="23.0" fill="#e1e4ea"/><text x="174.0" y="362.2" fill="#141820" font-size="20" text-anchor="middle">Chapter 5 by Friday?</text>
  <g class="pop a3"><circle cx="292" cy="380" r="15" fill="#fff" stroke="#e0567a" stroke-width="2"/><text x="292.0" y="386" font-size="15" text-anchor="middle">❤️</text></g>
  <g class="a4"><rect x="326" y="340" width="89" height="30" rx="15" fill="#eef8f1" stroke="#bfe5cb"/><text x="370.6" y="360" fill="#1b8f40" font-size="16" font-weight="700" text-anchor="middle">↩ Reply</text><rect x="425" y="340" width="108" height="30" rx="15" fill="#eef8f1" stroke="#bfe5cb"/><text x="479.4" y="360" fill="#1b8f40" font-size="16" font-weight="700" text-anchor="middle">↪ Forward</text></g>
  <g class="pop a5"><rect x="564.4" y="290" width="108" height="36" rx="18.0" fill="#1e8e3e"/><g transform="translate(578.4 298.4) scale(0.8)"><path d="M3 11V7a5 5 0 0 1 10 0v4" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><rect x="0" y="11" width="16" height="13" rx="3" fill="#fff"/></g><text x="602.4" y="313.76" fill="#fff" font-size="16" font-weight="700">Locked</text></g>
  <rect x="24" y="420" width="672" height="128" rx="26" fill="#fff" filter="url(#shadow)"/>
  <text x="48" y="458" fill="#8a8f9c" font-size="17" font-weight="800" letter-spacing="1.2">EMAIL WITH LEAH</text>
  <rect x="48" y="478" width="230" height="46" rx="23.0" fill="#e1e4ea"/><text x="163.2" y="508.2" fill="#141820" font-size="20" text-anchor="middle">Notes by Thursday?</text>
  <g class="pop a6"><circle cx="270" cy="526" r="15" fill="#fff" stroke="#e0567a" stroke-width="2"/><text x="270.4" y="532" font-size="15" text-anchor="middle">✅</text></g>
  <g class="a7"><rect x="304" y="486" width="89" height="30" rx="15" fill="#eef8f1" stroke="#bfe5cb"/><text x="349.0" y="506" fill="#1b8f40" font-size="16" font-weight="700" text-anchor="middle">↩ Reply</text><rect x="404" y="486" width="108" height="30" rx="15" fill="#eef8f1" stroke="#bfe5cb"/><text x="457.79999999999995" y="506" fill="#1b8f40" font-size="16" font-weight="700" text-anchor="middle">↪ Forward</text></g>
  <g class="pop a8"><rect x="458.8" y="436" width="213" height="36" rx="18.0" fill="#f2b705"/><g transform="translate(472.8 444.4) scale(0.8)"><path d="M3 11V7a5 5 0 0 1 10 0v4" fill="none" stroke="#141820" stroke-width="3" stroke-linecap="round"/><rect x="0" y="11" width="16" height="13" rx="3" fill="#141820"/></g><text x="496.8" y="459.76" fill="#141820" font-size="16" font-weight="700">Locked on the way</text></g>
  <rect x="24" y="566" width="672" height="128" rx="26" fill="#fff" filter="url(#shadow)"/>
  <text x="48" y="604" fill="#8a8f9c" font-size="17" font-weight="800" letter-spacing="1.2">IRC · #ASTRONOMY</text>
  <rect x="48" y="624" width="252" height="46" rx="23.0" fill="#e1e4ea"/><text x="174.0" y="654.2" fill="#141820" font-size="20" text-anchor="middle">Clear skies tonight!</text>
  <g class="pop a9"><circle cx="292" cy="672" r="15" fill="#fff" stroke="#e0567a" stroke-width="2"/><text x="292.0" y="678" font-size="15" text-anchor="middle">🔭</text></g>
  <g class="a10"><rect x="326" y="632" width="89" height="30" rx="15" fill="#eef8f1" stroke="#bfe5cb"/><text x="370.6" y="652" fill="#1b8f40" font-size="16" font-weight="700" text-anchor="middle">↩ Reply</text><rect x="425" y="632" width="108" height="30" rx="15" fill="#eef8f1" stroke="#bfe5cb"/><text x="479.4" y="652" fill="#1b8f40" font-size="16" font-weight="700" text-anchor="middle">↪ Forward</text></g>
  <g class="pop a11"><rect x="458.8" y="582" width="213" height="36" rx="18.0" fill="#f2b705"/><g transform="translate(472.8 590.4) scale(0.8)"><path d="M3 11V7a5 5 0 0 1 10 0v4" fill="none" stroke="#141820" stroke-width="3" stroke-linecap="round"/><rect x="0" y="11" width="16" height="13" rx="3" fill="#141820"/></g><text x="496.8" y="605.76" fill="#141820" font-size="16" font-weight="700">Locked on the way</text></g>
