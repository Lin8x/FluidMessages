<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1044" viewBox="0 0 720 1044" role="img" aria-label="FluidMessages opens the gate: your messages belong to you. A happy phone stands on a green path that runs through an open gate in a brick wall. Below is a checklist with green checks: no ads, no tracking, no account to make, no company holding your messages, free with public code anyone can check, and it works on every device.">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".14"/></filter><pattern id="brick" width="44" height="28" patternUnits="userSpaceOnUse"><rect width="44" height="28" fill="#cb7d60"/><path d="M0 1H44M0 15H44M22 1V15M1 15V28M43 15V28" stroke="#f1d6c8" stroke-width="2"/></pattern><clipPath id="scene"><rect x="24" y="180" width="672" height="300" rx="26"/></clipPath>
    <style>
      text { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .bob { animation: bob 3.2s ease-in-out infinite; }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      .ck { transform-box: fill-box; transform-origin: center; }
      .c1 { animation: c1 10s ease-out infinite; }
      @keyframes c1 { 0%, 6% { opacity: 0; transform: scale(.4); } 9% { opacity: 1; transform: scale(1.15); } 11%, 96% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1); } }
      .c2 { animation: c2 10s ease-out infinite; }
      @keyframes c2 { 0%, 12% { opacity: 0; transform: scale(.4); } 15% { opacity: 1; transform: scale(1.15); } 17%, 96% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1); } }
      .c3 { animation: c3 10s ease-out infinite; }
      @keyframes c3 { 0%, 18% { opacity: 0; transform: scale(.4); } 21% { opacity: 1; transform: scale(1.15); } 23%, 96% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1); } }
      .c4 { animation: c4 10s ease-out infinite; }
      @keyframes c4 { 0%, 24% { opacity: 0; transform: scale(.4); } 27% { opacity: 1; transform: scale(1.15); } 29%, 96% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1); } }
      .c5 { animation: c5 10s ease-out infinite; }
      @keyframes c5 { 0%, 30% { opacity: 0; transform: scale(.4); } 33% { opacity: 1; transform: scale(1.15); } 35%, 96% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1); } }
      .c6 { animation: c6 10s ease-out infinite; }
      @keyframes c6 { 0%, 36% { opacity: 0; transform: scale(.4); } 39% { opacity: 1; transform: scale(1.15); } 41%, 96% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; }  }

    </style>
  </defs>
  <rect width="720" height="1044" rx="32" fill="#eef9f0"/>
  <text x="360" y="64" fill="#141820" font-size="40" font-weight="800" text-anchor="middle">FluidMessages</text>
  <text x="360" y="110" fill="#141820" font-size="40" font-weight="800" text-anchor="middle">opens the gate</text>
  <text x="360" y="152" fill="#5b6070" font-size="24" text-anchor="middle">Your messages belong to you.</text>
  <g clip-path="url(#scene)">
    <rect x="24" y="180" width="672" height="300" fill="#e3f1ff"/>
    <circle cx="610" cy="232" r="26" fill="#ffd866"/>
    <rect x="24" y="318" width="672" height="162" fill="#d5efda"/>
    <path d="M330 318h60l116 162H214z" fill="#1fa84a"/>
    <rect x="24" y="258" width="250" height="146" fill="url(#brick)"/><rect x="446" y="258" width="250" height="146" fill="url(#brick)"/>
    <rect x="24" y="250" width="250" height="12" fill="#a9624a"/><rect x="446" y="250" width="250" height="12" fill="#a9624a"/>
    <rect x="262" y="236" width="24" height="170" rx="4" fill="#8f4f38"/><rect x="434" y="236" width="24" height="170" rx="4" fill="#8f4f38"/>
    <path d="M262 264l-56 30v154l56-44z" fill="#c08a55" stroke="#8a5a30" stroke-width="3" stroke-linejoin="round"/><path d="M243 276v140M225 286v150" stroke="#8a5a30" stroke-width="2"/>
    <path d="M458 264l56 30v154l-56-44z" fill="#c08a55" stroke="#8a5a30" stroke-width="3" stroke-linejoin="round"/><path d="M477 276v140M495 286v150" stroke="#8a5a30" stroke-width="2"/>
  </g>
  <rect x="24" y="180" width="672" height="300" rx="26" fill="none" stroke="#cfe0f2" stroke-width="2"/>
  <g class="bob"><rect x="322" y="330" width="76" height="120" rx="13" fill="#16161a"/><rect x="329" y="339" width="62" height="102" rx="8" fill="#e9fbee"/><circle cx="346" cy="378" r="5" fill="#141820"/><circle cx="374" cy="378" r="5" fill="#141820"/><path d="M342 396q18 18 36 0" fill="none" stroke="#141820" stroke-width="5" stroke-linecap="round"/></g>
  <rect x="24" y="504" width="672" height="516" rx="26" fill="#fff" filter="url(#shadow)"/>
  <g class="ck c1"><circle cx="78" cy="568" r="22" fill="#1fa84a"/><path d="M67 569l8 8 15-17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="118" y="577" fill="#141820" font-size="26" font-weight="600">No ads</text>
  <g class="ck c2"><circle cx="78" cy="640" r="22" fill="#1fa84a"/><path d="M67 641l8 8 15-17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="118" y="649" fill="#141820" font-size="26" font-weight="600">No tracking</text>
  <g class="ck c3"><circle cx="78" cy="712" r="22" fill="#1fa84a"/><path d="M67 713l8 8 15-17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="118" y="721" fill="#141820" font-size="26" font-weight="600">No account to make</text>
  <g class="ck c4"><circle cx="78" cy="784" r="22" fill="#1fa84a"/><path d="M67 785l8 8 15-17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="118" y="793" fill="#141820" font-size="26" font-weight="600">No company holding your messages</text>
  <g class="ck c5"><circle cx="78" cy="872" r="22" fill="#1fa84a"/><path d="M67 873l8 8 15-17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="118" y="864" fill="#141820" font-size="26" font-weight="600">Free, and the code is public</text>
  <text x="118" y="898" fill="#141820" font-size="26" font-weight="600">for anyone to check</text>
  <g class="ck c6"><circle cx="78" cy="960" r="22" fill="#1fa84a"/><path d="M67 961l8 8 15-17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="118" y="969" fill="#141820" font-size="26" font-weight="600">Works on every device</text>

</svg>
