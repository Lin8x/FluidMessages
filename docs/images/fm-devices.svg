<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1364" viewBox="0 0 720 1364" role="img" aria-label="Works on every device you own. An Android phone in the middle sends and gets your texts, and dots travel from it to Windows, Mac, Linux, iPhone and iPad in the browser, and any web browser. If you have an Android phone, link it and your texts show up on all of them. With no Android phone, everything except texting still works.">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".14"/></filter>
    <style>
      text { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .d1 { animation: d1 6s linear infinite; animation-delay: 0.0s; }
      @keyframes d1 { 0% { opacity: 0; transform: translate(0, 0); } 6% { opacity: 1; } 55% { opacity: 1; transform: translate(0, 102px); } 68% { opacity: 1; transform: translate(-34px, 102px); } 76%, 100% { opacity: 0; transform: translate(-34px, 102px); } }
      .d2 { animation: d2 6s linear infinite; animation-delay: 1.2s; }
      @keyframes d2 { 0% { opacity: 0; transform: translate(0, 0); } 6% { opacity: 1; } 55% { opacity: 1; transform: translate(0, 102px); } 68% { opacity: 1; transform: translate(34px, 102px); } 76%, 100% { opacity: 0; transform: translate(34px, 102px); } }
      .d3 { animation: d3 6s linear infinite; animation-delay: 2.4s; }
      @keyframes d3 { 0% { opacity: 0; transform: translate(0, 0); } 6% { opacity: 1; } 55% { opacity: 1; transform: translate(0, 278px); } 68% { opacity: 1; transform: translate(-34px, 278px); } 76%, 100% { opacity: 0; transform: translate(-34px, 278px); } }
      .d4 { animation: d4 6s linear infinite; animation-delay: 3.6s; }
      @keyframes d4 { 0% { opacity: 0; transform: translate(0, 0); } 6% { opacity: 1; } 55% { opacity: 1; transform: translate(0, 278px); } 68% { opacity: 1; transform: translate(34px, 278px); } 76%, 100% { opacity: 0; transform: translate(34px, 278px); } }
      .d5 { animation: d5 6s linear infinite; animation-delay: 4.8s; }
      @keyframes d5 { 0% { opacity: 0; transform: translate(0, 0); } 6% { opacity: 1; } 55% { opacity: 1; transform: translate(0, 392px); } 68% { opacity: 1; transform: translate(0, 392px); } 76%, 100% { opacity: 0; transform: translate(0, 392px); } }
      .dot { opacity: 0; }
      .ring { transform-box: fill-box; transform-origin: center; animation: ring 3s ease-out infinite; }
      @keyframes ring { 0% { opacity: .55; transform: scale(.9); } 70%, 100% { opacity: 0; transform: scale(1.25); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .ring { opacity: 0; } }

    </style>
  </defs>
  <rect width="720" height="1364" rx="32" fill="#eef4ff"/>
  <text x="360" y="64" fill="#141820" font-size="40" font-weight="800" text-anchor="middle">Works on every</text>
  <text x="360" y="110" fill="#141820" font-size="40" font-weight="800" text-anchor="middle">device you own</text>
  <text x="360" y="152" fill="#5b6070" font-size="24" text-anchor="middle">One app. Your messages, everywhere.</text>
  <rect class="ring" x="244" y="170" width="232" height="320" rx="44" fill="none" stroke="#1fa84a" stroke-width="6"/>
  <g filter="url(#shadow)"><rect x="260" y="184" width="200" height="292" rx="34" fill="#16161a"/><rect x="278" y="208" width="164" height="244" rx="20" fill="#e9fbee"/></g>
  <g><rect x="290" y="226" width="110" height="34" rx="17" fill="#e9e9ee"/><rect x="320" y="272" width="110" height="34" rx="17" fill="#1fa84a"/><rect x="290" y="318" width="84" height="34" rx="17" fill="#e9e9ee"/><rect x="302" y="364" width="128" height="34" rx="17" fill="#1fa84a"/><rect x="290" y="410" width="100" height="34" rx="17" fill="#e9e9ee"/></g>
  <text x="360" y="522" fill="#141820" font-size="28" font-weight="800" text-anchor="middle">Android phone</text>
  <text x="360" y="556" fill="#5b6070" font-size="24" text-anchor="middle">Sends and gets your texts</text>
  <line x1="360" y1="574" x2="360" y2="944" stroke="#b9c6dc" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"/>
  <g><rect x="24" y="596" width="324" height="160" rx="22" fill="#fff" filter="url(#shadow)"/>
    <g transform="translate(186 596)"><rect x="-50" y="18" width="100" height="60" rx="7" fill="#16161a"/><rect x="-44" y="24" width="88" height="48" rx="3" fill="#eef4ff"/><rect x="-36" y="30" width="36" height="9" rx="4.5" fill="#c3c8d4"/><rect x="-7" y="44" width="43" height="9" rx="4.5" fill="#1fa84a"/><rect x="-36" y="58" width="32" height="9" rx="4.5" fill="#c3c8d4"/><path d="M-66 78h132l-9 11h-114z" fill="#9aa0ad"/></g>
    <text x="186" y="724" fill="#141820" font-size="26" font-weight="800" text-anchor="middle">Windows</text>
  </g>
  <g><rect x="372" y="596" width="324" height="160" rx="22" fill="#fff" filter="url(#shadow)"/>
    <g transform="translate(534 596)"><rect x="-54" y="14" width="108" height="62" rx="8" fill="#16161a"/><rect x="-48" y="20" width="96" height="50" rx="3" fill="#f4eefc"/><rect x="-38" y="27" width="38" height="9" rx="4.5" fill="#c3c8d4"/><rect x="-8" y="41" width="46" height="9" rx="4.5" fill="#1fa84a"/><rect x="-38" y="55" width="34" height="9" rx="4.5" fill="#c3c8d4"/><rect x="-9" y="76" width="18" height="10" fill="#9aa0ad"/><rect x="-30" y="85" width="60" height="6" rx="3" fill="#9aa0ad"/></g>
    <text x="534" y="724" fill="#141820" font-size="26" font-weight="800" text-anchor="middle">Mac</text>
  </g>
  <g><rect x="24" y="772" width="324" height="160" rx="22" fill="#fff" filter="url(#shadow)"/>
    <g transform="translate(186 772)"><rect x="-54" y="14" width="108" height="62" rx="8" fill="#16161a"/><rect x="-48" y="20" width="96" height="50" rx="3" fill="#1d2230"/><path d="M-38 32l12 10-12 10" fill="none" stroke="#1fa84a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="-18" y="50" width="24" height="4" rx="2" fill="#1fa84a"/><rect x="-9" y="76" width="18" height="10" fill="#9aa0ad"/><rect x="-30" y="85" width="60" height="6" rx="3" fill="#9aa0ad"/></g>
    <text x="186" y="900" fill="#141820" font-size="26" font-weight="800" text-anchor="middle">Linux</text>
  </g>
  <g><rect x="372" y="772" width="324" height="160" rx="22" fill="#fff" filter="url(#shadow)"/>
    <g transform="translate(534 772)"><rect x="-62" y="12" width="84" height="64" rx="9" fill="#16161a"/><rect x="-56" y="18" width="72" height="52" rx="4" fill="#eef4ff"/><rect x="-48" y="25" width="28" height="9" rx="4.5" fill="#c3c8d4"/><rect x="-26" y="39" width="34" height="9" rx="4.5" fill="#1fa84a"/><rect x="-48" y="53" width="25" height="9" rx="4.5" fill="#c3c8d4"/><rect x="32" y="20" width="32" height="56" rx="7" fill="#16161a"/><rect x="35" y="25" width="26" height="46" rx="4" fill="#e9fbee"/></g>
    <text x="534" y="888" fill="#141820" font-size="26" font-weight="800" text-anchor="middle">iPhone and iPad</text>
    <text x="534" y="917" fill="#5b6070" font-size="22" text-anchor="middle">in your browser</text>
  </g>
  <g><rect x="198" y="948" width="324" height="160" rx="22" fill="#fff" filter="url(#shadow)"/>
    <g transform="translate(360 948)"><rect x="-64" y="14" width="128" height="74" rx="9" fill="#fff" stroke="#b9c0cf" stroke-width="3"/><path d="M-64 36h128" stroke="#b9c0cf" stroke-width="3"/><circle cx="-52" cy="25" r="4" fill="#e0567a"/><circle cx="-40" cy="25" r="4" fill="#e0a400"/><circle cx="-28" cy="25" r="4" fill="#1fa84a"/><rect x="-16" y="20" width="70" height="10" rx="5" fill="#e3e6ee"/><rect x="-50" y="44" width="50" height="9" rx="4.5" fill="#c3c8d4"/><rect x="-10" y="58" width="60" height="9" rx="4.5" fill="#1fa84a"/><rect x="-50" y="72" width="45" height="9" rx="4.5" fill="#c3c8d4"/></g>
    <text x="360" y="1076" fill="#141820" font-size="26" font-weight="800" text-anchor="middle">Any web browser</text>
  </g>
  <g class="dot d1"><circle cx="360" cy="574" r="9" fill="#1fa84a"/></g>
  <g class="dot d2"><circle cx="360" cy="574" r="9" fill="#1fa84a"/></g>
  <g class="dot d3"><circle cx="360" cy="574" r="9" fill="#1fa84a"/></g>
  <g class="dot d4"><circle cx="360" cy="574" r="9" fill="#1fa84a"/></g>
  <g class="dot d5"><circle cx="360" cy="574" r="9" fill="#1fa84a"/></g>
  <rect x="24" y="1132" width="672" height="208" rx="26" fill="#141820"/>
  <text x="360" y="1176" fill="#fff" font-size="24" text-anchor="middle"><tspan font-weight="800" fill="#7fe0a0">Have an Android phone?</tspan> Link it, and</text>
  <text x="360" y="1210" fill="#fff" font-size="24" text-anchor="middle">your texts show up on all of them.</text>
  <path d="M64 1236h592" stroke="#3a4050" stroke-width="2"/>
  <text x="360" y="1276" fill="#fff" font-size="24" text-anchor="middle"><tspan font-weight="800" fill="#9cc8ff">No Android phone?</tspan> Everything</text>
  <text x="360" y="1310" fill="#fff" font-size="24" text-anchor="middle">except texting still works.</text>

</svg>
