<svg xmlns="http://www.w3.org/2000/svg" width="720" height="800" viewBox="0 0 720 800" role="img" aria-label="One FluidMessages inbox gathers texts and open chat services: texts (SMS), Matrix, XMPP, Email, and IRC. The same inbox shows on your Android phone and on your computer, with a lock on every chat. Your Android phone sends the texts. A computer, iPhone or iPad gets the chat services on its own, and texts too if you link your Android phone.">
