<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Your texts plus four open chat services in one inbox. Matrix: modern chat that can be end-to-end encrypted, used by communities and workplaces. XMPP: a long-running open chat standard, run by many independent servers. Email: your mailbox, shown as conversations. IRC: classic public chat rooms for hobbies and open-source projects. None of them is owned by one company.">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".12"/></filter>
    <style>
      text { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .card { opacity: 0; animation: up 12s ease-out infinite; }
      .k2 { animation-delay: .5s; } .k3 { animation-delay: 1s; } .k4 { animation-delay: 1.5s; } .k5 { animation-delay: 2s; }
      @keyframes up { 0% { opacity: 0; transform: translateY(14px); } 4%, 93% { opacity: 1; transform: none; } 98%, 100% { opacity: 0; } }
      .flow { animation: flow 2.6s ease-in-out infinite; }
      @keyframes flow { 0% { opacity: 0; transform: translateY(0); } 20% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(44px); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .card { opacity: 1 !important; } .flow { opacity: 0 !important; } }
    </style>
  </defs>
  <rect width="1200" height="440" rx="28" fill="#f1f5fb"/>
  <text x="600" y="50" fill="#121a26" font-size="26" font-weight="800" text-anchor="middle">Your texts, plus open chat services</text>
  <text x="600" y="78" fill="#4d5a6b" font-size="16" text-anchor="middle">Free networks that no single company owns. Use any of them, all in one inbox, or none at all.</text>

  <g font-size="13">
    <g class="card" filter="url(#shadow)"><rect x="24" y="104" width="220" height="240" rx="20" fill="#fff"/></g>
    <g class="card"><rect x="44" y="124" width="44" height="44" rx="12" fill="#2fb350"/><text x="66" y="153" fill="#fff" font-size="20" text-anchor="middle">💬</text>
      <text x="100" y="142" fill="#121a26" font-size="17" font-weight="800">Texts</text><text x="100" y="160" fill="#4d5a6b" font-size="12">SMS and MMS</text>
      <text x="44" y="198" fill="#121a26">Your phone number.</text><text x="44" y="218" fill="#121a26">Works with every phone.</text>
      <text x="44" y="250" fill="#1b8f40" font-weight="700">🔒 Encrypted between</text><text x="44" y="268" fill="#1b8f40" font-weight="700">FluidMessages users</text>
      <text x="44" y="320" fill="#8a94a3" font-size="12">Android phone needed</text></g>

    <g class="card k2" filter="url(#shadow)"><rect x="258" y="104" width="220" height="240" rx="20" fill="#fff"/></g>
    <g class="card k2"><rect x="278" y="124" width="44" height="44" rx="12" fill="#121a26"/><text x="300" y="153" fill="#fff" font-size="19" font-weight="800" text-anchor="middle">[m]</text>
      <text x="334" y="142" fill="#121a26" font-size="17" font-weight="800">Matrix</text><text x="334" y="160" fill="#4d5a6b" font-size="12">modern open chat</text>
      <text x="278" y="198" fill="#121a26">Group chats, rooms, and</text><text x="278" y="218" fill="#121a26">communities. Used by</text><text x="278" y="238" fill="#121a26">workplaces and projects.</text>
      <text x="278" y="270" fill="#1b8f40" font-weight="700">🔒 Calls are encrypted</text>
      <text x="278" y="320" fill="#8a94a3" font-size="12">Like a free, open team chat</text></g>

    <g class="card k3" filter="url(#shadow)"><rect x="492" y="104" width="220" height="240" rx="20" fill="#fff"/></g>
    <g class="card k3"><rect x="512" y="124" width="44" height="44" rx="12" fill="#2a6fd6"/><text x="534" y="153" fill="#fff" font-size="17" font-weight="800" text-anchor="middle">X</text>
      <text x="568" y="142" fill="#121a26" font-size="17" font-weight="800">XMPP</text><text x="568" y="160" fill="#4d5a6b" font-size="12">also called Jabber</text>
      <text x="512" y="198" fill="#121a26">A long-running chat</text><text x="512" y="218" fill="#121a26">standard, run by many</text><text x="512" y="238" fill="#121a26">independent servers.</text>
      <text x="512" y="270" fill="#1b8f40" font-weight="700">🔒 Calls are encrypted</text>
      <text x="512" y="320" fill="#8a94a3" font-size="12">Like email, but instant</text></g>

    <g class="card k4" filter="url(#shadow)"><rect x="726" y="104" width="220" height="240" rx="20" fill="#fff"/></g>
    <g class="card k4"><rect x="746" y="124" width="44" height="44" rx="12" fill="#d13c55"/><text x="768" y="153" fill="#fff" font-size="20" text-anchor="middle">✉️</text>
      <text x="802" y="142" fill="#121a26" font-size="17" font-weight="800">Email</text><text x="802" y="160" fill="#4d5a6b" font-size="12">as conversations</text>
      <text x="746" y="198" fill="#121a26">Reach anyone with an</text><text x="746" y="218" fill="#121a26">email address. Only the</text><text x="746" y="238" fill="#121a26">chats you choose show up.</text>
      <text x="746" y="270" fill="#b07d00" font-weight="700">🔒 Protected on the way</text>
      <text x="746" y="320" fill="#8a94a3" font-size="12">Your existing mailbox</text></g>

    <g class="card k5" filter="url(#shadow)"><rect x="960" y="104" width="216" height="240" rx="20" fill="#fff"/></g>
    <g class="card k5"><rect x="980" y="124" width="44" height="44" rx="12" fill="#1f7fd6"/><text x="1002" y="153" fill="#fff" font-size="20" font-weight="800" text-anchor="middle">#</text>
      <text x="1036" y="142" fill="#121a26" font-size="17" font-weight="800">IRC</text><text x="1036" y="160" fill="#4d5a6b" font-size="12">classic chat rooms</text>
      <text x="980" y="198" fill="#121a26">Big public rooms about</text><text x="980" y="218" fill="#121a26">hobbies and open-source</text><text x="980" y="238" fill="#121a26">projects.</text>
      <text x="980" y="270" fill="#b07d00" font-weight="700">🔒 Protected on the way</text>
      <text x="980" y="320" fill="#8a94a3" font-size="12">Like old-school forums, live</text></g>
  </g>

  <!-- They all land in one inbox -->
  <g fill="#1fa84a"><circle class="flow" cx="134" cy="356" r="5"/><circle class="flow" cx="368" cy="356" r="5" style="animation-delay:.3s"/><circle class="flow" cx="602" cy="356" r="5" style="animation-delay:.6s"/><circle class="flow" cx="836" cy="356" r="5" style="animation-delay:.9s"/><circle class="flow" cx="1068" cy="356" r="5" style="animation-delay:1.2s"/></g>
  <rect x="380" y="396" width="440" height="34" rx="17" fill="#121a26"/><text x="600" y="418" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">One inbox · a small tag on each chat shows where it's from</text>
</svg>
