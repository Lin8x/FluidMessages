<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="Privacy tools in FluidMessages: app lock with your fingerprint, a hidden folder for private chats, a decoy code that opens a harmless pretend inbox, an emergency erase code that wipes everything, and disappearing messages.">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".12"/></filter>
    <style>
      text { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .card { opacity: 0; animation: up 15s ease-out infinite; }
      .k2 { animation-delay: .5s; } .k3 { animation-delay: 1s; } .k4 { animation-delay: 1.5s; } .k5 { animation-delay: 2s; }
      @keyframes up { 0% { opacity: 0; transform: translateY(14px); } 4%, 94% { opacity: 1; transform: none; } 99%, 100% { opacity: 0; } }
      .scan { animation: scan 2.4s ease-in-out infinite; }
      @keyframes scan { 0%, 100% { transform: translateY(0); opacity: .2; } 50% { transform: translateY(26px); opacity: .9; } }
      .slide { animation: slide 4s ease-in-out infinite; }
      @keyframes slide { 0%, 20% { transform: translateX(0); opacity: 1; } 55%, 75% { transform: translateX(62px); opacity: .2; } 100% { transform: translateX(0); opacity: 1; } }
      .swap1 { animation: swapA 5s ease-in-out infinite; } .swap2 { animation: swapB 5s ease-in-out infinite; }
      @keyframes swapA { 0%, 45% { opacity: 1; } 50%, 95% { opacity: 0; } 100% { opacity: 1; } }
      @keyframes swapB { 0%, 45% { opacity: 0; } 50%, 95% { opacity: 1; } 100% { opacity: 0; } }
      .wipe { transform-box: fill-box; transform-origin: left; animation: wipe 4.5s ease-in-out infinite; }
      @keyframes wipe { 0%, 30% { transform: scaleX(1); } 60%, 85% { transform: scaleX(0); } 100% { transform: scaleX(1); } }
      .fade { animation: fade 4s ease-in-out infinite; }
      @keyframes fade { 0%, 30% { opacity: 1; filter: blur(0); } 65%, 85% { opacity: 0; filter: blur(3px); } 100% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .card { opacity: 1 !important; } .swap2 { opacity: 0; } }
    </style>
  </defs>
  <rect width="1200" height="430" rx="28" fill="#f4f2fb"/>
  <text x="600" y="52" fill="#1c1630" font-size="26" font-weight="800" text-anchor="middle">Privacy tools other texting apps don't have</text>
  <text x="600" y="80" fill="#5d5873" font-size="16" text-anchor="middle">For a nosy roommate, a lost phone, or someone demanding to see your messages.</text>

  <!-- App lock -->
  <g class="card" filter="url(#shadow)"><rect x="30" y="110" width="216" height="290" rx="22" fill="#fff"/></g>
  <g class="card">
    <circle cx="138" cy="176" r="40" fill="#efeafd"/>
    <g fill="none" stroke="#6c4cdc" stroke-width="3" stroke-linecap="round"><path d="M118 168 a20 20 0 0 1 40 0 v14"/><path d="M126 186 v-18 a12 12 0 0 1 24 0 v22"/><path d="M138 166 v26"/></g>
    <rect class="scan" x="108" y="150" width="60" height="4" rx="2" fill="#6c4cdc"/>
    <text x="138" y="250" fill="#1c1630" font-size="18" font-weight="800" text-anchor="middle">App lock</text>
    <text x="138" y="276" fill="#5d5873" font-size="13" text-anchor="middle">Opens with your</text><text x="138" y="294" fill="#5d5873" font-size="13" text-anchor="middle">fingerprint or code.</text>
    <text x="138" y="322" fill="#5d5873" font-size="13" text-anchor="middle">Lock single chats too.</text>
  </g>

  <!-- Hidden folder -->
  <g class="card k2" filter="url(#shadow)"><rect x="262" y="110" width="216" height="290" rx="22" fill="#fff"/></g>
  <g class="card k2">
    <rect x="300" y="150" width="140" height="56" rx="10" fill="#f3f4f7"/>
    <g class="slide"><rect x="310" y="162" width="60" height="32" rx="8" fill="#e0567a"/><text x="340" y="183" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">Chat</text></g>
    <rect x="392" y="154" width="44" height="48" rx="8" fill="#6c4cdc"/><text x="414" y="184" font-size="18" text-anchor="middle">🗂️</text>
    <text x="370" y="250" fill="#1c1630" font-size="18" font-weight="800" text-anchor="middle">Hidden folder</text>
    <text x="370" y="276" fill="#5d5873" font-size="13" text-anchor="middle">Private chats vanish</text><text x="370" y="294" fill="#5d5873" font-size="13" text-anchor="middle">from your inbox until</text>
    <text x="370" y="312" fill="#5d5873" font-size="13" text-anchor="middle">you unlock them.</text>
  </g>

  <!-- Decoy mode -->
  <g class="card k3" filter="url(#shadow)"><rect x="494" y="110" width="216" height="290" rx="22" fill="#fff"/></g>
  <g class="card k3">
    <rect x="556" y="132" width="92" height="96" rx="12" fill="#16161a"/><rect x="562" y="138" width="80" height="84" rx="8" fill="#fff"/>
    <g class="swap1" font-size="9"><rect x="568" y="146" width="66" height="14" rx="7" fill="#e0567a"/><text x="574" y="156" fill="#fff">Private plans</text><rect x="568" y="166" width="58" height="14" rx="7" fill="#6c4cdc"/><text x="574" y="176" fill="#fff">Secret chat</text><text x="602" y="206" fill="#5d5873" text-anchor="middle">your real inbox</text></g>
    <g class="swap2" font-size="9"><rect x="568" y="146" width="66" height="14" rx="7" fill="#e9e9ee"/><text x="574" y="156" fill="#141820">Mom: dinner?</text><rect x="568" y="166" width="58" height="14" rx="7" fill="#e9e9ee"/><text x="574" y="176" fill="#141820">Dentist ✅</text><text x="602" y="206" fill="#5d5873" text-anchor="middle">pretend inbox</text></g>
    <text x="602" y="250" fill="#1c1630" font-size="18" font-weight="800" text-anchor="middle">Decoy mode</text>
    <text x="602" y="276" fill="#5d5873" font-size="13" text-anchor="middle">A second code opens a</text><text x="602" y="294" fill="#5d5873" font-size="13" text-anchor="middle">harmless pretend inbox</text>
    <text x="602" y="312" fill="#5d5873" font-size="13" text-anchor="middle">if you're forced to unlock.</text>
  </g>

  <!-- Emergency erase -->
  <g class="card k4" filter="url(#shadow)"><rect x="726" y="110" width="216" height="290" rx="22" fill="#fff"/></g>
  <g class="card k4">
    <rect x="770" y="150" width="128" height="16" rx="8" fill="#f3f4f7"/><rect class="wipe" x="770" y="150" width="128" height="16" rx="8" fill="#e0567a"/>
    <rect x="770" y="174" width="128" height="16" rx="8" fill="#f3f4f7"/><rect class="wipe" x="770" y="174" width="104" height="16" rx="8" fill="#6c4cdc"/>
    <rect x="770" y="198" width="128" height="16" rx="8" fill="#f3f4f7"/><rect class="wipe" x="770" y="198" width="116" height="16" rx="8" fill="#1f7fd6"/>
    <text x="834" y="250" fill="#1c1630" font-size="18" font-weight="800" text-anchor="middle">Emergency erase</text>
    <text x="834" y="276" fill="#5d5873" font-size="13" text-anchor="middle">A special code quietly</text><text x="834" y="294" fill="#5d5873" font-size="13" text-anchor="middle">wipes everything and</text>
    <text x="834" y="312" fill="#5d5873" font-size="13" text-anchor="middle">looks like a normal unlock.</text>
  </g>

  <!-- Disappearing -->
  <g class="card k5" filter="url(#shadow)"><rect x="958" y="110" width="216" height="290" rx="22" fill="#fff"/></g>
  <g class="card k5">
    <g class="fade"><rect x="990" y="150" width="152" height="32" rx="16" fill="#1fa84a"/><text x="1066" y="171" fill="#fff" font-size="12" text-anchor="middle">The gate code is 4821</text></g>
    <text x="1066" y="206" fill="#5d5873" font-size="12" text-anchor="middle">⏱ disappears in 1 hour</text>
    <text x="1066" y="250" fill="#1c1630" font-size="18" font-weight="800" text-anchor="middle">Disappearing</text>
    <text x="1066" y="276" fill="#5d5873" font-size="13" text-anchor="middle">Messages remove</text><text x="1066" y="294" fill="#5d5873" font-size="13" text-anchor="middle">themselves after an hour,</text>
    <text x="1066" y="312" fill="#5d5873" font-size="13" text-anchor="middle">a day, or a week.</text>
  </g>
</svg>
