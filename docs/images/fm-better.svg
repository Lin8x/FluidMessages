<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1070" viewBox="0 0 720 1070" role="img" aria-label="Same texts, way better app. In your old texting app, a reaction shows up as the sentence Loved See you at 7, there are no backups, and you have no idea who can read your texts. In FluidMessages the same chat shows a real heart on the bubble, a Pizza or tacos poll, locked backups, and a lock that shows who can read it.">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".13"/></filter>
    <linearGradient id="bub" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1fa84a"/><stop offset="1" stop-color="#1b8f40"/></linearGradient>
    <style>
      text { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .pop { transform-box: fill-box; transform-origin: center; animation: pop 12s ease-out infinite; }
      @keyframes pop { 0%, 10% { transform: scale(0); opacity: 0; } 14% { transform: scale(1.35); opacity: 1; } 17%, 95% { transform: scale(1); opacity: 1; } 99%, 100% { transform: scale(0); opacity: 0; } }
      .bar { transform-box: fill-box; transform-origin: left; animation: grow 12s ease-out infinite; }
      .b2 { animation-delay: .3s; animation-fill-mode: backwards; }
      @keyframes grow { 0%, 20% { transform: scaleX(0); } 30%, 95% { transform: scaleX(1); } 99%, 100% { transform: scaleX(0); } }
      .note { opacity: 0; animation: in 12s ease-out infinite; }
      .n1 { animation-delay: 3.6s; } .n2 { animation-delay: 4.1s; } .n3 { animation-delay: 4.6s; }
      @keyframes in { 0% { opacity: 0; transform: translateX(-10px); } 4%, 56% { opacity: 1; transform: none; } 60%, 100% { opacity: 0; transform: none; } }
      .glow { animation: glow 3s ease-in-out infinite; }
      @keyframes glow { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .note { opacity: 1 !important; } }
    </style>
  </defs>
  <rect width="720" height="1070" rx="32" fill="#f2f4f8"/>
  <text x="360" y="72" fill="#141820" font-size="40" font-weight="800" text-anchor="middle">Same texts. Way better app.</text>

  <!-- OLD -->
  <rect x="24" y="108" width="672" height="384" rx="28" fill="#fff" filter="url(#shadow)"/>
  <text x="52" y="154" fill="#8a8f9c" font-size="22" font-weight="800" letter-spacing="1.5">YOUR OLD TEXTING APP</text>
  <rect x="48" y="174" width="624" height="164" rx="22" fill="#f1f1f4"/>
  <rect x="446" y="190" width="206" height="56" rx="28" fill="#c9cbd3"/>
  <text x="549" y="227" fill="#3a3e4a" font-size="24" text-anchor="middle">See you at 7</text>
  <rect x="68" y="264" width="318" height="56" rx="28" fill="#dedfe5"/>
  <text x="227" y="301" fill="#3a3e4a" font-size="24" text-anchor="middle">Loved “See you at 7”</text>
  <g font-size="24" fill="#3a3e4a">
    <g><circle cx="68" cy="374" r="15" fill="#fbe9e7"/><path d="M61 367 l14 14 M75 367 l-14 14" stroke="#b3261e" stroke-width="4" stroke-linecap="round"/><text x="96" y="383">Reactions show up as sentences</text></g>
    <g><circle cx="68" cy="416" r="15" fill="#fbe9e7"/><path d="M61 409 l14 14 M75 409 l-14 14" stroke="#b3261e" stroke-width="4" stroke-linecap="round"/><text x="96" y="425">No backups</text></g>
    <g><circle cx="68" cy="458" r="15" fill="#fbe9e7"/><path d="M61 451 l14 14 M75 451 l-14 14" stroke="#b3261e" stroke-width="4" stroke-linecap="round"/><text x="96" y="467">No idea who can read it</text></g>
  </g>

  <!-- NEW -->
  <rect x="24" y="520" width="672" height="518" rx="28" fill="#fff" filter="url(#shadow)"/>
  <rect x="25.500" y="521.500" width="669" height="515" rx="26.500" fill="none" stroke="#1fa84a" stroke-width="3"/>
  <text x="52" y="570" fill="#1b8f40" font-size="22" font-weight="800" letter-spacing="1.5">FLUIDMESSAGES</text>
  <rect x="506" y="540" width="166" height="44" rx="22" fill="#e6f6ec"/>
  <rect class="glow" x="506" y="540" width="166" height="44" rx="22" fill="none" stroke="#1fa84a" stroke-width="2.500"/>
  <text x="589" y="570" fill="#1b8f40" font-size="22" font-weight="700" text-anchor="middle">🔒 Locked</text>

  <rect x="48" y="598" width="624" height="290" rx="22" fill="#eef8f1"/>
  <rect x="446" y="614" width="206" height="56" rx="28" fill="url(#bub)"/>
  <text x="549" y="651" fill="#fff" font-size="24" font-weight="600" text-anchor="middle">See you at 7</text>
  <g class="pop">
    <circle cx="452" cy="672" r="24" fill="#fff" stroke="#e0567a" stroke-width="3"/>
    <text x="452" y="681" font-size="24" text-anchor="middle">❤️</text>
  </g>
  <!-- poll -->
  <rect x="68" y="706" width="390" height="166" rx="22" fill="#fff" stroke="#d6eadc" stroke-width="2"/>
  <text x="90" y="746" fill="#141820" font-size="24" font-weight="800">Pizza or tacos?</text>
  <text x="90" y="790" fill="#3a3e4a" font-size="22">Pizza</text>
  <rect x="166" y="770" width="270" height="24" rx="12" fill="#e9e9ee"/>
  <rect class="bar" x="166" y="770" width="200" height="24" rx="12" fill="#1fa84a"/>
  <text x="90" y="840" fill="#3a3e4a" font-size="22">Tacos</text>
  <rect x="166" y="820" width="270" height="24" rx="12" fill="#e9e9ee"/>
  <rect class="bar b2" x="166" y="820" width="90" height="24" rx="12" fill="#6c4cdc"/>

  <g font-size="24" fill="#141820" font-weight="600">
    <g class="note n1"><circle cx="68" cy="922" r="15" fill="#1fa84a"/><path d="M60 922 l6 6 l11 -12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="96" y="931">Real hearts and reactions</text></g>
    <g class="note n2"><circle cx="68" cy="964" r="15" fill="#1fa84a"/><path d="M60 964 l6 6 l11 -12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="96" y="973">Locked backups</text></g>
    <g class="note n3"><circle cx="68" cy="1006" r="15" fill="#1fa84a"/><path d="M60 1006 l6 6 l11 -12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="96" y="1015">A lock shows who can read it</text></g>
  </g>
</svg>
