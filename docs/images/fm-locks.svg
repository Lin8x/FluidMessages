<svg xmlns="http://www.w3.org/2000/svg" width="720" height="774" viewBox="0 0 720 774" role="img" aria-label="A lock on every chat, so you always know who could read it. A green closed lock means only you and the other person can read it. A yellow closed lock means it is protected on the way, but the service could read it. A red open lock means a regular text that is not private.">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".14"/></filter>
    <style>
      text { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .lk { transform-box: fill-box; transform-origin: center; }
      .k1 { animation: k1 9s ease-out infinite; }
      @keyframes k1 { 0%, 5% { opacity: 0; transform: scale(.4); } 8% { opacity: 1; transform: scale(1.15); } 10%, 96% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1); } }
      .k2 { animation: k2 9s ease-out infinite; }
      @keyframes k2 { 0%, 15% { opacity: 0; transform: scale(.4); } 18% { opacity: 1; transform: scale(1.15); } 20%, 96% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1); } }
      .k3 { animation: k3 9s ease-out infinite; }
      @keyframes k3 { 0%, 25% { opacity: 0; transform: scale(.4); } 28% { opacity: 1; transform: scale(1.15); } 30%, 96% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; }  }

    </style>
  </defs>
  <rect width="720" height="774" rx="32" fill="#f5f6fa"/>
  <text x="360" y="64" fill="#141820" font-size="40" font-weight="800" text-anchor="middle">A lock on every chat</text>
  <text x="360" y="106" fill="#5b6070" font-size="24" text-anchor="middle">So you always know who could read it.</text>
  <rect x="24" y="140" width="672" height="186" rx="26" fill="#fff" filter="url(#shadow)"/>
  <g class="lk k1"><rect x="48" y="168" width="130" height="130" rx="30" fill="#e3f7e9"/><g transform="translate(113 229)"><path d="M-22 0v-18a22 22 0 0 1 44 0v18" fill="none" stroke="#1fa84a" stroke-width="11" stroke-linecap="round"/><rect x="-36" y="-2" width="72" height="54" rx="12" fill="#1fa84a"/><circle cx="0" cy="20" r="8" fill="#fff"/><rect x="-3.5" y="22" width="7" height="16" rx="3.5" fill="#fff"/></g></g>
  <text x="206" y="202" fill="#1b8f40" font-size="30" font-weight="800">Green lock</text>
  <text x="206" y="244" fill="#141820" font-size="24">Only you and the other</text>
  <text x="206" y="278" fill="#141820" font-size="24">person can read it</text>
  <rect x="24" y="346" width="672" height="186" rx="26" fill="#fff" filter="url(#shadow)"/>
  <g class="lk k2"><rect x="48" y="374" width="130" height="130" rx="30" fill="#fdf1cc"/><g transform="translate(113 435)"><path d="M-22 0v-18a22 22 0 0 1 44 0v18" fill="none" stroke="#e0a400" stroke-width="11" stroke-linecap="round"/><rect x="-36" y="-2" width="72" height="54" rx="12" fill="#e0a400"/><circle cx="0" cy="20" r="8" fill="#fff"/><rect x="-3.5" y="22" width="7" height="16" rx="3.5" fill="#fff"/></g></g>
  <text x="206" y="408" fill="#b07d00" font-size="30" font-weight="800">Yellow lock</text>
  <text x="206" y="450" fill="#141820" font-size="24">Protected on the way, but</text>
  <text x="206" y="484" fill="#141820" font-size="24">the service could read it</text>
  <rect x="24" y="552" width="672" height="186" rx="26" fill="#fff" filter="url(#shadow)"/>
  <g class="lk k3"><rect x="48" y="580" width="130" height="130" rx="30" fill="#fde0de"/><g transform="translate(113 645)"><path d="M-22 0v-26a22 22 0 0 1 44 0v10" fill="none" stroke="#b3261e" stroke-width="11" stroke-linecap="round"/><rect x="-36" y="-2" width="72" height="54" rx="12" fill="#b3261e"/><circle cx="0" cy="20" r="8" fill="#fff"/><rect x="-3.5" y="22" width="7" height="16" rx="3.5" fill="#fff"/></g></g>
  <text x="206" y="614" fill="#b3261e" font-size="30" font-weight="800">Red open lock</text>
  <text x="206" y="656" fill="#141820" font-size="24">A regular text.</text>
  <text x="206" y="690" fill="#141820" font-size="24">Not private.</text>

</svg>
