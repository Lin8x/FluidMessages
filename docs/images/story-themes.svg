<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="One chat shown in four themes in turn: Fluid, Ember, Midnight, and Love. Bubble colors, background, and wallpaper change with each theme.">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".18"/></filter>
    <linearGradient id="wall1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef6ff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <linearGradient id="wall2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3e8"/><stop offset="1" stop-color="#ffe1cf"/></linearGradient>
    <linearGradient id="wall3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151a2e"/><stop offset="1" stop-color="#0b0e1a"/></linearGradient>
    <linearGradient id="wall4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe8f0"/><stop offset="1" stop-color="#ffd2e2"/></linearGradient>
    <style>
      text { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .t { opacity: 0; animation: show 12s ease-in-out infinite; }
      .t2 { animation-delay: 3s; } .t3 { animation-delay: 6s; } .t4 { animation-delay: 9s; }
      @keyframes show { 0% { opacity: 0; } 3%, 25% { opacity: 1; } 28%, 100% { opacity: 0; } }
      .dot { opacity: .35; animation: on 12s steps(1) infinite; }
      .o2 { animation-delay: 3s; } .o3 { animation-delay: 6s; } .o4 { animation-delay: 9s; }
      @keyframes on { 0% { opacity: 1; } 25%, 100% { opacity: .35; } }
      .hearts text { animation: rise 3s ease-out infinite; opacity: 0; }
      @keyframes rise { 0% { opacity: 0; transform: translateY(0); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateY(-120px); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .t1 { opacity: 1 !important; } .dot.o1 { opacity: 1 !important; } }
    </style>
  </defs>
  <rect width="1200" height="420" rx="28" fill="#f6f4f1"/>
  <text x="60" y="80" fill="#1a1612" font-size="15" font-weight="800" letter-spacing="2">MADE TO BE YOURS</text>
  <text x="60" y="124" fill="#1a1612" font-size="36" font-weight="800">No more gray.</text>
  <text x="60" y="164" fill="#544c44" font-size="18">Eight themes, each in light and dark.</text>
  <text x="60" y="192" fill="#544c44" font-size="18">Your own bubble colors and wallpapers.</text>
  <text x="60" y="220" fill="#544c44" font-size="18">Sounds, bubble shapes, and motion.</text>
  <text x="60" y="248" fill="#544c44" font-size="18">A different look for each chat if you like.</text>
  <g font-size="15" font-weight="700">
    <g class="dot o1"><circle cx="72" cy="300" r="12" fill="#0a84ff"/><text x="92" y="305" fill="#1a1612">Fluid</text></g>
    <g class="dot o2"><circle cx="162" cy="300" r="12" fill="#e8590c"/><text x="182" y="305" fill="#1a1612">Ember</text></g>
    <g class="dot o3"><circle cx="262" cy="300" r="12" fill="#5e5ce6"/><text x="282" y="305" fill="#1a1612">Midnight</text></g>
    <g class="dot o4"><circle cx="382" cy="300" r="12" fill="#e2366f"/><text x="402" y="305" fill="#1a1612">Love</text></g>
  </g>
  <text x="60" y="360" fill="#8a8078" font-size="14">…plus Lavender, Evergreen, Tideline, and Rosewater.</text>

  <!-- Phone frame -->
  <g filter="url(#shadow)"><rect x="700" y="24" width="250" height="372" rx="36" fill="#16161a"/></g>

  <!-- Theme 1: Fluid -->
  <g class="t t1"><rect x="711" y="38" width="228" height="344" rx="26" fill="url(#wall1)"/>
    <text x="730" y="72" fill="#141820" font-size="14" font-weight="700">Maya</text>
    <rect x="726" y="96" width="140" height="32" rx="16" fill="#e9e9ee"/><text x="740" y="117" fill="#141820" font-size="13">Movie tonight? 🍿</text>
    <rect x="790" y="140" width="136" height="32" rx="16" fill="#0a84ff"/><text x="804" y="161" fill="#fff" font-size="13">Yes! Pick one 🎬</text>
    <rect x="726" y="184" width="120" height="32" rx="16" fill="#e9e9ee"/><text x="740" y="205" fill="#141820" font-size="13">Space Story?</text>
    <rect x="800" y="228" width="126" height="32" rx="16" fill="#0a84ff"/><text x="814" y="249" fill="#fff" font-size="13">Perfect ❤️</text></g>
  <!-- Theme 2: Ember -->
  <g class="t t2"><rect x="711" y="38" width="228" height="344" rx="26" fill="url(#wall2)"/>
    <text x="730" y="72" fill="#3a1e10" font-size="14" font-weight="700">Maya</text>
    <rect x="726" y="96" width="140" height="32" rx="6" fill="#fff"/><text x="740" y="117" fill="#3a1e10" font-size="13">Movie tonight? 🍿</text>
    <rect x="790" y="140" width="136" height="32" rx="6" fill="#c2410c"/><text x="804" y="161" fill="#fff" font-size="13">Yes! Pick one 🎬</text>
    <rect x="726" y="184" width="120" height="32" rx="6" fill="#fff"/><text x="740" y="205" fill="#3a1e10" font-size="13">Space Story?</text>
    <rect x="800" y="228" width="126" height="32" rx="6" fill="#c2410c"/><text x="814" y="249" fill="#fff" font-size="13">Perfect ❤️</text></g>
  <!-- Theme 3: Midnight -->
  <g class="t t3"><rect x="711" y="38" width="228" height="344" rx="26" fill="url(#wall3)"/>
    <circle cx="760" cy="300" r="1.5" fill="#fff"/><circle cx="890" cy="320" r="1.2" fill="#fff"/><circle cx="830" cy="350" r="1" fill="#fff"/><circle cx="900" cy="290" r="1" fill="#fff"/>
    <text x="730" y="72" fill="#e8eaf6" font-size="14" font-weight="700">Maya</text>
    <rect x="726" y="96" width="140" height="32" rx="16" fill="#2a2f45"/><text x="740" y="117" fill="#e8eaf6" font-size="13">Movie tonight? 🍿</text>
    <rect x="790" y="140" width="136" height="32" rx="16" fill="#5e5ce6"/><text x="804" y="161" fill="#fff" font-size="13">Yes! Pick one 🎬</text>
    <rect x="726" y="184" width="120" height="32" rx="16" fill="#2a2f45"/><text x="740" y="205" fill="#e8eaf6" font-size="13">Space Story?</text>
    <rect x="800" y="228" width="126" height="32" rx="16" fill="#5e5ce6"/><text x="814" y="249" fill="#fff" font-size="13">Perfect ❤️</text></g>
  <!-- Theme 4: Love -->
  <g class="t t4"><rect x="711" y="38" width="228" height="344" rx="26" fill="url(#wall4)"/>
    <text x="730" y="72" fill="#4a1027" font-size="14" font-weight="700">Maya</text>
    <rect x="726" y="96" width="140" height="32" rx="16" fill="#fff"/><text x="740" y="117" fill="#4a1027" font-size="13">Movie tonight? 🍿</text>
    <rect x="790" y="140" width="136" height="32" rx="16" fill="#c2185b"/><text x="804" y="161" fill="#fff" font-size="13">Yes! Pick one 🎬</text>
    <rect x="726" y="184" width="120" height="32" rx="16" fill="#fff"/><text x="740" y="205" fill="#4a1027" font-size="13">Space Story?</text>
    <rect x="800" y="228" width="126" height="32" rx="16" fill="#c2185b"/><text x="814" y="249" fill="#fff" font-size="13">Perfect ❤️</text>
    <g class="hearts" font-size="14"><text x="760" y="360">💕</text><text x="840" y="370" style="animation-delay:1s">💗</text><text x="900" y="360" style="animation-delay:2s">💖</text></g></g>

  <rect x="726" y="340" width="200" height="30" rx="15" fill="#fff" fill-opacity=".85"/><text x="740" y="360" fill="#8a8f9c" font-size="12">Text message</text>
  <text x="1040" y="200" fill="#544c44" font-size="14" text-anchor="middle">Same chat,</text><text x="1040" y="220" fill="#544c44" font-size="14" text-anchor="middle">four looks.</text>
</svg>
