<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="Three ways to use FluidMessages. On an Android phone: your texts plus your other chats. On any computer or browser, even without Android, including iPhone: chat services, communities, and calls, without texts. With both linked: everything on both, in sync, including texting from your computer.">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".12"/></filter>
    <style>
      text { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .card { opacity: 0; animation: in 12s ease-out infinite; }
      .c2 { animation-delay: .8s; } .c3 { animation-delay: 1.6s; }
      @keyframes in { 0% { opacity: 0; transform: translateY(14px); } 4%, 93% { opacity: 1; transform: none; } 98%, 100% { opacity: 0; } }
      .dot { animation: go 2.4s ease-in-out infinite; }
      .back { animation: back 2.4s ease-in-out infinite; animation-delay: 1.2s; }
      @keyframes go { 0% { transform: translateX(0); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateX(118px); opacity: 0; } }
      @keyframes back { 0% { transform: translateX(0); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateX(-118px); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .card { opacity: 1 !important; } .dot, .back { opacity: 0 !important; } }
    </style>
  </defs>
  <rect width="1200" height="470" rx="28" fill="#f3f6fb"/>

  <!-- 1: Android phone on its own -->
  <g class="card" filter="url(#shadow)"><rect x="30" y="30" width="360" height="410" rx="24" fill="#fff"/></g>
  <g class="card">
    <rect x="164" y="56" width="92" height="150" rx="16" fill="#16161a"/><rect x="171" y="66" width="78" height="130" rx="11" fill="#e9fbee"/>
    <rect x="180" y="82" width="52" height="12" rx="6" fill="#2fb350"/><rect x="186" y="102" width="56" height="12" rx="6" fill="#7b4fe0"/><rect x="180" y="122" width="44" height="12" rx="6" fill="#1f7fd6"/>
    <text x="210" y="236" fill="#141820" font-size="20" font-weight="800" text-anchor="middle">Android phone</text>
    <text x="210" y="260" fill="#5b6070" font-size="14" text-anchor="middle">The full app in your pocket</text>
    <g font-size="14" fill="#141820"><text x="60" y="300">✅ Your texts and picture texts</text><text x="60" y="326">✅ Calls from your number</text><text x="60" y="352">✅ Other chat services</text><text x="60" y="378">✅ Backups, privacy, themes</text><text x="60" y="404" fill="#9aa0ab">➖ Typing on a big keyboard</text></g>
  </g>

  <!-- 2: Any computer or browser, no Android needed -->
  <g class="card c2" filter="url(#shadow)"><rect x="420" y="30" width="360" height="410" rx="24" fill="#fff"/></g>
  <g class="card c2">
    <rect x="538" y="62" width="124" height="82" rx="8" fill="#16161a"/><rect x="545" y="69" width="110" height="68" rx="4" fill="#eef4ff"/>
    <rect x="553" y="79" width="40" height="10" rx="5" fill="#7b4fe0"/><rect x="560" y="97" width="56" height="10" rx="5" fill="#1f7fd6"/><rect x="553" y="115" width="46" height="10" rx="5" fill="#d13c55"/>
    <rect x="590" y="144" width="20" height="10" fill="#2a2a2e"/><rect x="572" y="154" width="56" height="6" rx="3" fill="#2a2a2e"/>
    <rect x="680" y="96" width="36" height="64" rx="8" fill="#16161a"/><rect x="684" y="102" width="28" height="52" rx="5" fill="#eef4ff"/>
    <text x="600" y="236" fill="#141820" font-size="20" font-weight="800" text-anchor="middle">Any computer or browser</text>
    <text x="600" y="260" fill="#5b6070" font-size="14" text-anchor="middle">No Android needed · Windows, Mac, Linux, iPhone</text>
    <g font-size="14" fill="#141820"><text x="450" y="300">✅ Chat services, often encrypted</text><text x="450" y="326">✅ Communities with many rooms</text><text x="450" y="352">✅ Voice and video calls</text><text x="450" y="378">✅ Themes, effects, polls, games</text><text x="450" y="404" fill="#9aa0ab">➖ Your texts (link an Android phone)</text></g>
  </g>

  <!-- 3: Both, linked -->
  <g class="card c3" filter="url(#shadow)"><rect x="810" y="30" width="360" height="410" rx="24" fill="#fff" stroke="#1fc144" stroke-width="2"/></g>
  <g class="card c3">
    <rect x="852" y="80" width="56" height="94" rx="11" fill="#16161a"/><rect x="857" y="87" width="46" height="80" rx="7" fill="#e9fbee"/>
    <rect x="1050" y="76" width="96" height="64" rx="7" fill="#16161a"/><rect x="1056" y="82" width="84" height="52" rx="4" fill="#e9fbee"/>
    <rect x="1088" y="140" width="20" height="8" fill="#2a2a2e"/><rect x="1072" y="148" width="52" height="6" rx="3" fill="#2a2a2e"/>
    <line x1="918" y1="118" x2="1040" y2="118" stroke="#b9c3d1" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
    <circle class="dot" cx="922" cy="118" r="6" fill="#1fc144"/><circle class="back" cx="1036" cy="118" r="6" fill="#1f7fd6"/>
    <text x="990" y="236" fill="#141820" font-size="20" font-weight="800" text-anchor="middle">Both, linked together</text>
    <text x="990" y="260" fill="#1b8f40" font-size="14" font-weight="700" text-anchor="middle">The best of both, in sync</text>
    <g font-size="14" fill="#141820"><text x="840" y="300">✅ Texting from your computer</text><text x="840" y="326">✅ Everything on both screens</text><text x="840" y="352">✅ Settings stay in sync</text><text x="840" y="378">✅ Read on one, it's read on both</text><text x="840" y="404">✅ You choose when they differ</text></g>
  </g>
</svg>
