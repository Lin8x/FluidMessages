<svg xmlns="http://www.w3.org/2000/svg" width="720" height="832" viewBox="0 0 720 832" role="img" aria-label="Get FluidMessages in three steps. One: tap the green Download button on your Android phone. Two: open the file and tap Install, and say yes if your phone asks. Three: pick your colors, then tap Set as default, and your old texts are already there.">
  <defs>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".12"/></filter>
    <style>
      text { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .st { opacity: 0; animation: up 11s ease-out infinite; }
      @keyframes up { 0% { opacity: 0; transform: translateY(16px); } 5%, 93% { opacity: 1; transform: none; } 98%, 100% { opacity: 0; transform: none; } }
      .ck { opacity: 0; transform-box: fill-box; transform-origin: center; animation: ck 11s ease-out infinite; }
      @keyframes ck { 0%, 2% { opacity: 0; transform: translateY(-26px) scale(1.5); } 6% { opacity: 1; transform: scale(.9); } 8%, 93% { opacity: 1; transform: none; } 98%, 100% { opacity: 0; transform: none; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .st, .ck { opacity: 1 !important; } }
    </style>
  </defs>
  <rect width="720" height="832" rx="32" fill="#eef8f1"/>
  <text x="360" y="66" fill="#141820" font-size="40" font-weight="800" text-anchor="middle">Get it in 3 steps</text>
  <g class="st" style="animation-delay:0.0s">
    <rect x="24" y="104" width="672" height="196" rx="26" fill="#fff" filter="url(#shadow)"/>
    <circle cx="104" cy="160" r="34" fill="#1fa84a"/><text x="104" y="174" fill="#fff" font-size="40" font-weight="800" text-anchor="middle">1</text>
    <rect x="50" y="212" width="108" height="56" rx="28" fill="#1fa84a"/><path d="M104 225 v26 m-12 -11 l12 13 l12 -13" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="196" y="170" fill="#141820" font-size="28" font-weight="800">Download</text>
    <text x="196" y="210" fill="#5b6070" font-size="24">Tap the green Download button</text>
    <text x="196" y="242" fill="#5b6070" font-size="24">on your Android phone.</text>
  </g>
  <g class="ck" style="animation-delay:0.7s"><circle cx="650" cy="154" r="22" fill="#e7f6ec" stroke="#1fa84a" stroke-width="3"/><path d="M639 155 l8 8 l15 -17" fill="none" stroke="#1b8f40" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g class="st" style="animation-delay:1.0s">
    <rect x="24" y="320" width="672" height="228" rx="26" fill="#fff" filter="url(#shadow)"/>
    <circle cx="104" cy="376" r="34" fill="#1fa84a"/><text x="104" y="390" fill="#fff" font-size="40" font-weight="800" text-anchor="middle">2</text>
    <path d="M70 426 h44 l24 24 v72 h-68 z" fill="#e7f6ec" stroke="#1b8f40" stroke-width="3" stroke-linejoin="round"/><path d="M114 426 v24 h24" fill="none" stroke="#1b8f40" stroke-width="3" stroke-linejoin="round"/><circle cx="134" cy="510" r="20" fill="#1fa84a"/><path d="M134 500 v18 m-8 -8 l8 9 l8 -9" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="196" y="386" fill="#141820" font-size="28" font-weight="800">Install</text>
    <text x="196" y="426" fill="#5b6070" font-size="24">Open the file and tap Install.</text>
    <text x="196" y="458" fill="#5b6070" font-size="24">Your phone may ask if it's okay.</text>
    <text x="196" y="490" fill="#5b6070" font-size="24">Say yes.</text>
  </g>
  <g class="ck" style="animation-delay:1.7s"><circle cx="650" cy="370" r="22" fill="#e7f6ec" stroke="#1fa84a" stroke-width="3"/><path d="M639 371 l8 8 l15 -17" fill="none" stroke="#1b8f40" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g class="st" style="animation-delay:2.0s">
    <rect x="24" y="568" width="672" height="228" rx="26" fill="#fff" filter="url(#shadow)"/>
    <circle cx="104" cy="624" r="34" fill="#1fa84a"/><text x="104" y="638" fill="#fff" font-size="40" font-weight="800" text-anchor="middle">3</text>
    <circle cx="68" cy="692" r="15" fill="#e0567a"/><circle cx="104" cy="692" r="15" fill="#6c4cdc"/><circle cx="140" cy="692" r="15" fill="#1f7fd6"/><rect x="66" y="726" width="76" height="40" rx="20" fill="#1fa84a"/><circle cx="122" cy="746" r="14" fill="#fff"/>
    <text x="196" y="634" fill="#141820" font-size="28" font-weight="800">Make it your texting app</text>
    <text x="196" y="674" fill="#5b6070" font-size="24">Pick your colors, then let</text>
    <text x="196" y="706" fill="#5b6070" font-size="24">it handle texts. Your old texts</text>
    <text x="196" y="738" fill="#5b6070" font-size="24">are already there.</text>
  </g>
  <g class="ck" style="animation-delay:2.7s"><circle cx="650" cy="618" r="22" fill="#e7f6ec" stroke="#1fa84a" stroke-width="3"/><path d="M639 619 l8 8 l15 -17" fill="none" stroke="#1b8f40" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>

</svg>
