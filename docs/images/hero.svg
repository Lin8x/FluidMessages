<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="FluidMessages: texts, calls, and chats in one private app. An animated phone shows messages, a poll, and a reaction arriving.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1fa85a"/><stop offset=".5" stop-color="#1f7fd6"/><stop offset="1" stop-color="#7b4fe0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".3"/></filter>
    <clipPath id="screen"><rect x="812" y="46" width="244" height="356" rx="30"/></clipPath>
    <style>
      text { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .blob { animation: drift 14s ease-in-out infinite alternate; }
      .b2 { animation-duration: 18s; animation-delay: -6s; }
      .b3 { animation-duration: 22s; animation-delay: -3s; }
      @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(90px, -40px); } }
      .msg { opacity: 0; animation: pop 12s ease-out infinite; }
      .m2 { animation-delay: 1.2s; } .m3 { animation-delay: 2.6s; } .m4 { animation-delay: 4s; } .m5 { animation-delay: 5.6s; } .m6 { animation-delay: 7s; }
      @keyframes pop {
        0% { opacity: 0; transform: translateY(14px); }
        4%, 86% { opacity: 1; transform: translateY(0); }
        94%, 100% { opacity: 0; transform: translateY(0); }
      }
      .bar { animation: grow 12s ease-out infinite; animation-delay: 4s; transform-box: fill-box; transform-origin: left; }
      @keyframes grow { 0%, 6% { transform: scaleX(.1); } 16%, 100% { transform: scaleX(1); } }
      .typing circle { animation: blink 1.2s infinite; }
      .typing circle:nth-child(2) { animation-delay: .2s; } .typing circle:nth-child(3) { animation-delay: .4s; }
      @keyframes blink { 0%, 60%, 100% { opacity: .3; } 30% { opacity: 1; } }
      .chip { animation: float 6s ease-in-out infinite alternate; }
      .c2 { animation-delay: -2s; } .c3 { animation-delay: -4s; } .c4 { animation-delay: -1s; } .c5 { animation-delay: -3s; }
      @keyframes float { from { transform: translateY(0); } to { transform: translateY(-6px); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }
    </style>
  </defs>

  <rect width="1200" height="440" rx="28" fill="url(#sky)"/>
  <g filter="url(#soft)" opacity=".55">
    <circle class="blob" cx="180" cy="80" r="150" fill="#6ff0a0"/>
    <circle class="blob b2" cx="620" cy="400" r="170" fill="#5ec8ff"/>
    <circle class="blob b3" cx="1080" cy="60" r="140" fill="#ff7ad9"/>
  </g>

  <!-- Words -->
  <text x="72" y="150" fill="#fff" font-size="64" font-weight="800" letter-spacing="-1">FluidMessages</text>
  <text x="74" y="200" fill="#fff" fill-opacity=".95" font-size="26" font-weight="600">Your texts, calls, and chats.</text>
  <text x="74" y="236" fill="#fff" fill-opacity=".95" font-size="26" font-weight="600">One private app.</text>
  <g font-size="15" font-weight="700">
    <g class="chip"><rect x="74" y="276" width="70" height="32" rx="16" fill="#fff" fill-opacity=".2"/><text x="109" y="297" fill="#fff" text-anchor="middle">SMS</text></g>
    <g class="chip c2"><rect x="154" y="276" width="86" height="32" rx="16" fill="#fff" fill-opacity=".2"/><text x="197" y="297" fill="#fff" text-anchor="middle">Matrix</text></g>
    <g class="chip c3"><rect x="250" y="276" width="76" height="32" rx="16" fill="#fff" fill-opacity=".2"/><text x="288" y="297" fill="#fff" text-anchor="middle">XMPP</text></g>
    <g class="chip c4"><rect x="336" y="276" width="74" height="32" rx="16" fill="#fff" fill-opacity=".2"/><text x="373" y="297" fill="#fff" text-anchor="middle">Email</text></g>
    <g class="chip c5"><rect x="420" y="276" width="60" height="32" rx="16" fill="#fff" fill-opacity=".2"/><text x="450" y="297" fill="#fff" text-anchor="middle">IRC</text></g>
    <g class="chip c2"><rect x="490" y="276" width="76" height="32" rx="16" fill="#fff" fill-opacity=".2"/><text x="528" y="297" fill="#fff" text-anchor="middle">Calls</text></g>
  </g>
  <text x="74" y="352" fill="#fff" fill-opacity=".85" font-size="17">Open source · No ads · No tracking · Android, web, and desktop</text>

  <!-- Phone -->
  <g filter="url(#shadow)">
    <rect x="800" y="30" width="268" height="388" rx="42" fill="#111"/>
    <rect x="812" y="46" width="244" height="356" rx="30" fill="#f4f5f7"/>
  </g>
  <g clip-path="url(#screen)">
    <rect x="812" y="46" width="244" height="58" fill="#fff"/>
    <circle cx="842" cy="76" r="15" fill="#e0912b"/><text x="842" y="81" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">BC</text>
    <text x="866" y="72" fill="#111" font-size="14" font-weight="700">Book club</text>
    <text x="866" y="89" fill="#666" font-size="11">Email · 5 people</text>
    <circle cx="934" cy="54" r="4" fill="#111"/>

    <g class="msg"><rect x="826" y="118" width="150" height="34" rx="17" fill="#e4e5e9"/><text x="840" y="140" fill="#111" font-size="13">Who's hosting? 📚</text></g>
    <g class="msg m2"><rect x="902" y="160" width="140" height="34" rx="17" fill="#1f7fd6"/><text x="916" y="182" fill="#fff" font-size="13">My place! 🍰</text></g>
    <g class="msg m3">
      <rect x="826" y="204" width="186" height="104" rx="18" fill="#e4e5e9"/>
      <text x="840" y="224" fill="#555" font-size="10" font-weight="700" letter-spacing="1">POLL</text>
      <text x="840" y="242" fill="#111" font-size="13" font-weight="700">Next month's book?</text>
      <rect x="840" y="252" width="158" height="22" rx="8" fill="#fff"/>
      <rect class="bar" x="840" y="252" width="118" height="22" rx="8" fill="#b9d6f5"/>
      <text x="848" y="267" fill="#111" font-size="11">✓ Piranesi</text><text x="990" y="267" fill="#111" font-size="11" text-anchor="end">3</text>
      <rect x="840" y="278" width="158" height="22" rx="8" fill="#fff"/>
      <rect class="bar" x="840" y="278" width="40" height="22" rx="8" fill="#d6d8de"/>
      <text x="848" y="293" fill="#111" font-size="11">Klara and the Sun</text><text x="990" y="293" fill="#111" font-size="11" text-anchor="end">1</text>
    </g>
    <g class="msg m4"><rect x="990" y="296" width="40" height="24" rx="12" fill="#fff" stroke="#e4e5e9"/><text x="1010" y="313" font-size="13" text-anchor="middle">❤️</text></g>
    <g class="msg m5"><rect x="916" y="328" width="126" height="34" rx="17" fill="#1f7fd6"/><text x="930" y="350" fill="#fff" font-size="13">Piranesi it is! 🎉</text></g>
    <g class="msg m6 typing"><rect x="826" y="368" width="58" height="26" rx="13" fill="#e4e5e9"/>
      <circle cx="843" cy="381" r="3.5" fill="#777"/><circle cx="855" cy="381" r="3.5" fill="#777"/><circle cx="867" cy="381" r="3.5" fill="#777"/></g>
  </g>

  <!-- Little cards floating beside the phone -->
  <g class="chip c3"><rect x="660" y="96" width="122" height="44" rx="14" fill="#fff"/><text x="676" y="124" fill="#111" font-size="14" font-weight="700">🔒 Encrypted</text></g>
  <g class="chip c5"><rect x="672" y="300" width="112" height="44" rx="14" fill="#fff"/><text x="688" y="328" fill="#111" font-size="14" font-weight="700">♟️ Your move</text></g>
  <g class="chip c4"><rect x="1088" y="160" width="96" height="44" rx="14" fill="#fff"/><text x="1102" y="188" fill="#111" font-size="14" font-weight="700">📞 Call</text></g>
</svg>
