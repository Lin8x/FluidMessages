<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Backups: your messages are packed into a password-locked backup file and saved where you choose, to your phone, your own server, or a cloud service. When you get a new phone, the backup brings everything back.">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".13"/></filter>
    <style>
      text { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .pack { animation: pack 9s ease-in-out infinite; }
      .p2 { animation-delay: .25s; } .p3 { animation-delay: .5s; }
      @keyframes pack { 0%, 8% { transform: translate(0, 0); opacity: 1; } 24% { transform: translate(206px, 0) scale(.6); opacity: 0; } 100% { opacity: 0; transform: translate(206px, 0); } }
      .file { opacity: 0; transform-box: fill-box; transform-origin: center; animation: file 9s cubic-bezier(.34, 1.5, .5, 1) infinite; }
      @keyframes file { 0%, 20% { opacity: 0; transform: scale(.4); } 28%, 94% { opacity: 1; transform: scale(1); } 100% { opacity: 0; } }
      .send { opacity: 0; animation: send 9s ease-in-out infinite; }
      .s2 { animation-delay: .3s; } .s3 { animation-delay: .6s; }
      @keyframes send { 0%, 32% { opacity: 0; transform: translateX(0); } 36% { opacity: 1; } 48% { opacity: 1; transform: translateX(126px); } 52%, 100% { opacity: 0; transform: translateX(126px); } }
      .dest { opacity: .35; animation: lit 9s ease-out infinite; }
      @keyframes lit { 0%, 46% { opacity: .35; } 52%, 94% { opacity: 1; } 100% { opacity: .35; } }
      .restore { opacity: 0; animation: back 9s ease-out infinite; }
      @keyframes back { 0%, 62% { opacity: 0; transform: translateY(8px); } 70%, 94% { opacity: 1; transform: none; } 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .send { opacity: 0 !important; } .pack { opacity: 1 !important; transform: none !important; } .file, .dest, .restore { opacity: 1 !important; } }
    </style>
  </defs>
  <rect width="1200" height="380" rx="28" fill="#eef6f2"/>
  <text x="600" y="52" fill="#11241a" font-size="26" font-weight="800" text-anchor="middle">Never lose a text again</text>
  <text x="600" y="80" fill="#4a5d52" font-size="16" text-anchor="middle">Locked with your password, saved where you choose, on a schedule if you like.</text>

  <!-- Your phone -->
  <g filter="url(#shadow)"><rect x="80" y="112" width="128" height="220" rx="22" fill="#16161a"/></g>
  <rect x="88" y="124" width="112" height="196" rx="15" fill="#fff"/>
  <g font-size="10"><g class="pack"><rect x="98" y="140" width="80" height="18" rx="9" fill="#1fa84a"/><text x="106" y="153" fill="#fff">Photos 📷</text></g>
    <g class="pack p2"><rect x="108" y="166" width="82" height="18" rx="9" fill="#7b4fe0"/><text x="116" y="179" fill="#fff">Group chats</text></g>
    <g class="pack p3"><rect x="98" y="192" width="70" height="18" rx="9" fill="#1f7fd6"/><text x="106" y="205" fill="#fff">Themes 🎨</text></g></g>
  <text x="144" y="352" fill="#4a5d52" font-size="13" text-anchor="middle">Your phone</text>

  <!-- Backup file -->
  <g class="file"><g filter="url(#shadow)"><path d="M300 150 h70 l26 26 v96 h-96 z" fill="#fff"/></g><path d="M370 150 v26 h26" fill="none" stroke="#cfe6d6" stroke-width="2"/>
    <rect x="322" y="200" width="52" height="40" rx="8" fill="#1fa84a"/><path d="M334 200 v-8 a14 14 0 0 1 28 0 v8" fill="none" stroke="#1fa84a" stroke-width="5"/>
    <text x="348" y="226" fill="#fff" font-size="12" font-weight="800" text-anchor="middle">AES</text>
    <text x="348" y="300" fill="#11241a" font-size="13" font-weight="700" text-anchor="middle">Locked backup</text><text x="348" y="318" fill="#4a5d52" font-size="12" text-anchor="middle">only your password opens it</text></g>

  <!-- Destinations -->
  <g font-size="12">
    <g class="send"><circle cx="420" cy="148" r="6" fill="#1fa84a"/></g><g class="send s2"><circle cx="420" cy="222" r="6" fill="#1fa84a"/></g><g class="send s3"><circle cx="420" cy="296" r="6" fill="#1fa84a"/></g>
    <g class="dest"><rect x="560" y="124" width="250" height="50" rx="14" fill="#fff" stroke="#cfe6d6"/><text x="578" y="155" font-size="20">📱</text><text x="610" y="146" fill="#11241a" font-weight="700" font-size="14">On this phone</text><text x="610" y="164" fill="#4a5d52">a file you can move anywhere</text></g>
    <g class="dest"><rect x="560" y="198" width="250" height="50" rx="14" fill="#fff" stroke="#cfe6d6"/><text x="578" y="229" font-size="20">🏠</text><text x="610" y="220" fill="#11241a" font-weight="700" font-size="14">Your own server</text><text x="610" y="238" fill="#4a5d52">a home computer or NAS</text></g>
    <g class="dest"><rect x="560" y="272" width="250" height="50" rx="14" fill="#fff" stroke="#cfe6d6"/><text x="578" y="303" font-size="20">☁️</text><text x="610" y="294" fill="#11241a" font-weight="700" font-size="14">A cloud you choose</text><text x="610" y="312" fill="#4a5d52">Google Drive, OneDrive, S3</text></g>
  </g>

  <!-- New phone restore -->
  <line x1="830" y1="223" x2="940" y2="223" stroke="#b9d4c3" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>
  <g filter="url(#shadow)"><rect x="960" y="112" width="128" height="220" rx="22" fill="#16161a"/></g>
  <rect x="968" y="124" width="112" height="196" rx="15" fill="#fff"/>
  <g class="restore" font-size="10"><text x="1024" y="146" fill="#1b8f40" font-weight="800" text-anchor="middle">Restored ✓</text>
    <rect x="978" y="160" width="80" height="18" rx="9" fill="#1fa84a"/><text x="986" y="173" fill="#fff">Photos 📷</text>
    <rect x="988" y="186" width="82" height="18" rx="9" fill="#7b4fe0"/><text x="996" y="199" fill="#fff">Group chats</text>
    <rect x="978" y="212" width="70" height="18" rx="9" fill="#1f7fd6"/><text x="986" y="225" fill="#fff">Themes 🎨</text></g>
  <text x="1024" y="352" fill="#4a5d52" font-size="13" text-anchor="middle">Your new phone</text>
</svg>
