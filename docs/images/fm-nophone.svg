<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-label="No Android phone? You on an iPhone or a computer. A text (SMS) can’t go out, because texting needs your Android phone. But messages on Matrix, XMPP, Email, and IRC still reach your friends, whatever app they use.">
  <defs>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".12"/></filter>
    <style>
      text { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .pop { transform-box: fill-box; transform-origin: center; }
      .f0 { animation: kf0 10s ease-in-out infinite; }
@keyframes kf0 { 0%, 6% { opacity: 0; transform: translate(-90px, 0px); } 8% { opacity: 1; transform: translate(-90px, 0px); } 22%, 92% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; transform: none; } }
      .a1 { animation: ka1 10s ease-out infinite; }
@keyframes ka1 { 0%, 24% { opacity: 0; transform: scale(.4); } 28%, 92% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; transform: none; } }
      .f2 { animation: kf2 10s ease-in-out infinite; }
@keyframes kf2 { 0%, 38% { opacity: 0; transform: translate(-152.8px, 0px); } 40% { opacity: 1; transform: translate(-152.8px, 0px); } 50%, 92% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; transform: none; } }
      .a3 { animation: ka3 10s ease-out infinite; }
@keyframes ka3 { 0%, 50% { opacity: 0; transform: scale(.4); } 54%, 92% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; transform: none; } }
      .f4 { animation: kf4 10s ease-in-out infinite; }
@keyframes kf4 { 0%, 50% { opacity: 0; transform: translate(-173.2px, 0px); } 52% { opacity: 1; transform: translate(-173.2px, 0px); } 62%, 92% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; transform: none; } }
      .a5 { animation: ka5 10s ease-out infinite; }
@keyframes ka5 { 0%, 62% { opacity: 0; transform: scale(.4); } 66%, 92% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; transform: none; } }
      .f6 { animation: kf6 10s ease-in-out infinite; }
@keyframes kf6 { 0%, 62% { opacity: 0; transform: translate(-163.0px, 0px); } 64% { opacity: 1; transform: translate(-163.0px, 0px); } 74%, 92% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; transform: none; } }
      .a7 { animation: ka7 10s ease-out infinite; }
@keyframes ka7 { 0%, 74% { opacity: 0; transform: scale(.4); } 78%, 92% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; transform: none; } }
      .f8 { animation: kf8 10s ease-in-out infinite; }
@keyframes kf8 { 0%, 74% { opacity: 0; transform: translate(-183.39999999999998px, 0px); } 76% { opacity: 1; transform: translate(-183.39999999999998px, 0px); } 86%, 92% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; transform: none; } }
      .a9 { animation: ka9 10s ease-out infinite; }
@keyframes ka9 { 0%, 86% { opacity: 0; transform: scale(.4); } 90%, 92% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; transform: none; } }
      @media (prefers-reduced-motion: reduce) { .f0, .a1, .f2, .a3, .f4, .a5, .f6, .a7, .f8, .a9 { animation: none !important; opacity: 1 !important; transform: none !important; }  }
