<svg xmlns="http://www.w3.org/2000/svg" width="720" height="920" viewBox="0 0 720 920" role="img" aria-label="Make it look like you. A phone shows a short chat whose colors change through four of the 8 themes: Fluid in green, Ember in orange, Midnight in dark navy and purple, and Love in pink. You can change colors, wallpaper, and sounds.">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".15"/></filter>
    <clipPath id="screen"><rect x="134" y="190" width="452" height="512" rx="36"/></clipPath>
    <style>
      text { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .th { opacity: 0; animation: th 12s ease-in-out infinite; }
      .t1 { animation-delay: -1s; } .t2 { animation-delay: -10s; } .t3 { animation-delay: -7s; } .t4 { animation-delay: -4s; }
      @keyframes th { 0% { opacity: 0; } 4%, 25% { opacity: 1; } 29%, 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .t1 { opacity: 1 !important; } }
    </style>
  </defs>
  <rect width="720" height="920" rx="32" fill="#f5f3fa"/>
  <text x="360" y="72" fill="#141820" font-size="42" font-weight="800" text-anchor="middle">Make it look like you</text>
  <text x="360" y="114" fill="#5b6070" font-size="24" text-anchor="middle">8 themes, light and dark. Change</text>
  <text x="360" y="146" fill="#5b6070" font-size="24" text-anchor="middle">colors, wallpaper, and sounds.</text>

  <rect x="120" y="176" width="480" height="540" rx="50" fill="#16161a" filter="url(#shadow)"/>
