<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Animated: messages travel between a phone and a computer running FluidMessages Web">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e9fbee"/><stop offset="1" stop-color="#e8f3ff"/></linearGradient>
    <style>
      text { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .dot { animation: go 3.2s ease-in-out infinite; }
      .back { animation: back 3.2s ease-in-out infinite; animation-delay: 1.6s; }
      .d2 { animation-delay: .5s; } .d3 { animation-delay: 1s; }
      @keyframes go { 0% { transform: translateX(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateX(470px); opacity: 0; } }
      @keyframes back { 0% { transform: translateX(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateX(-470px); opacity: 0; } }
      .new { opacity: 0; animation: arrive 6.4s ease-out infinite; }
      .n2 { animation-delay: 3.2s; }
      @keyframes arrive { 0%, 40% { opacity: 0; transform: translateY(8px); } 46%, 90% { opacity: 1; transform: none; } 100% { opacity: 0; } }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-out infinite; }
      @keyframes pulse { from { transform: scale(1); opacity: .5; } to { transform: scale(1.8); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .new { opacity: 1 !important; } .dot, .back, .pulse { opacity: 0 !important; } }
    </style>
  </defs>
  <rect width="1200" height="260" rx="28" fill="url(#sky)"/>

  <!-- Phone -->
  <g transform="translate(150 22)">
    <rect width="130" height="216" rx="24" fill="#111"/>
    <rect x="8" y="10" width="114" height="196" rx="17" fill="#fff"/>
    <text x="65" y="36" fill="#111" font-size="12" font-weight="700" text-anchor="middle">Messages</text>
    <rect x="18" y="54" width="70" height="20" rx="10" fill="#e4e5e9"/><rect x="42" y="82" width="70" height="20" rx="10" fill="#0f9a32"/>
    <g class="new n2"><rect x="18" y="110" width="80" height="20" rx="10" fill="#e4e5e9"/><text x="26" y="124" fill="#111" font-size="10">From the web 💻</text></g>
    <text x="65" y="196" fill="#666" font-size="10" text-anchor="middle">Android</text>
  </g>

  <!-- Path -->
  <g transform="translate(330 128)">
    <line x1="0" y1="0" x2="490" y2="0" stroke="#9fb3c8" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
    <circle class="dot" cx="10" cy="0" r="8" fill="#1fc144"/><circle class="dot d2" cx="10" cy="0" r="6" fill="#1fc144"/><circle class="dot d3" cx="10" cy="0" r="5" fill="#1fc144"/>
    <circle class="back" cx="480" cy="0" r="7" fill="#1f7fd6"/>
    <g transform="translate(245 -44)">
      <circle class="pulse" r="26" fill="#1fc144"/>
      <circle r="26" fill="#fff" stroke="#1fc144" stroke-width="3"/>
      <text y="7" font-size="20" text-anchor="middle">🔄</text>
    </g>
    <text x="245" y="34" fill="#334" font-size="16" font-weight="700" text-anchor="middle">Texts, chats, and settings stay in sync</text>
    <text x="245" y="58" fill="#556" font-size="13" text-anchor="middle">If both changed the same thing, you choose which one to keep</text>
  </g>

  <!-- Computer -->
  <g transform="translate(860 30)">
    <rect width="230" height="150" rx="14" fill="#111"/>
    <rect x="8" y="8" width="214" height="134" rx="8" fill="#fff"/>
    <rect x="8" y="8" width="64" height="134" rx="8" fill="#f1f3f6"/>
    <rect x="16" y="20" width="48" height="10" rx="5" fill="#d5dae2"/><rect x="16" y="38" width="48" height="10" rx="5" fill="#d5dae2"/><rect x="16" y="56" width="48" height="10" rx="5" fill="#d5dae2"/>
    <rect x="84" y="26" width="80" height="18" rx="9" fill="#e4e5e9"/>
    <g class="new"><rect x="120" y="54" width="92" height="18" rx="9" fill="#0f9a32"/><text x="128" y="67" fill="#fff" font-size="9.5">From your phone 📱</text></g>
    <rect x="96" y="158" width="38" height="16" fill="#222"/><rect x="70" y="172" width="90" height="10" rx="5" fill="#333"/>
    <text x="115" y="208" fill="#666" font-size="11" text-anchor="middle">FluidMessages Web</text>
  </g>
</svg>
