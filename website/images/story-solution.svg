<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="The fix: the same conversation in FluidMessages. The heart shows as a real heart on the message, bubbles are in your colors, a lock shows who can read it, confetti plays, a poll fills in, a backup check appears, and the same chat shows on a laptop.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9fbee"/><stop offset="1" stop-color="#e8f1ff"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".16"/></filter>
    <style>
      text { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .m { opacity: 0; animation: in 12s ease-out infinite; }
      .d1 { animation-delay: .2s; } .d2 { animation-delay: .9s; } .d4 { animation-delay: 3.2s; } .d5 { animation-delay: 4.6s; }
      @keyframes in { 0% { opacity: 0; transform: translateY(8px); } 4%, 92% { opacity: 1; transform: none; } 98%, 100% { opacity: 0; } }
      .heart { opacity: 0; transform-box: fill-box; transform-origin: center; animation: heart 12s cubic-bezier(.34, 1.8, .5, 1) infinite; animation-delay: 1.8s; }
      @keyframes heart { 0% { opacity: 0; transform: scale(0); } 3%, 90% { opacity: 1; transform: scale(1); } 96%, 100% { opacity: 0; } }
      .floaty { opacity: 0; animation: up 12s ease-out infinite; animation-delay: 1.8s; }
      .floaty.b { animation-delay: 2s; } .floaty.c { animation-delay: 2.2s; }
      @keyframes up { 0% { opacity: 0; transform: translateY(0); } 2% { opacity: 1; } 12% { opacity: 0; transform: translateY(-90px); } 100% { opacity: 0; } }
      .bit { opacity: 0; animation: fall 12s linear infinite; animation-delay: 4.6s; }
      @keyframes fall { 0% { opacity: 1; transform: translateY(0) rotate(0); } 14% { opacity: 1; transform: translateY(330px) rotate(400deg); } 15%, 100% { opacity: 0; } }
      .bar { transform-box: fill-box; transform-origin: left; animation: bar 12s ease-out infinite; animation-delay: 3.4s; }
      @keyframes bar { 0%, 3% { transform: scaleX(.05); } 12%, 100% { transform: scaleX(1); } }
      .chip { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop 12s cubic-bezier(.34, 1.5, .5, 1) infinite; }
      .c1 { animation-delay: 1.2s; } .c2 { animation-delay: 5.6s; } .c3 { animation-delay: 6.6s; } .c4 { animation-delay: 7.6s; }
      @keyframes pop { 0% { opacity: 0; transform: scale(.5); } 4%, 88% { opacity: 1; transform: scale(1); } 95%, 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .m, .heart, .chip { opacity: 1 !important; } .floaty, .bit { opacity: 0 !important; } }
    </style>
  </defs>
  <rect width="1200" height="460" rx="28" fill="url(#sky)"/>

  <text x="56" y="70" fill="#0f7a34" font-size="15" font-weight="800" letter-spacing="2">THE FIX</text>
  <text x="56" y="114" fill="#14231a" font-size="36" font-weight="800">Texting, the way</text>
  <text x="56" y="156" fill="#14231a" font-size="36" font-weight="800">it should feel.</text>
  <text x="56" y="196" fill="#3d4d43" font-size="17">The same chat with Sam, in FluidMessages.</text>

  <!-- Phone -->
  <g filter="url(#shadow)">
    <rect x="470" y="40" width="250" height="390" rx="34" fill="#16161a"/>
    <rect x="481" y="54" width="228" height="362" rx="26" fill="#fff"/>
  </g>
  <circle cx="508" cy="80" r="15" fill="#7b4fe0"/><text x="508" y="85" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">S</text>
  <text x="530" y="78" fill="#14231a" font-size="14" font-weight="700">Sam</text>
  <text x="530" y="94" fill="#6b7280" font-size="11">Text message · not encrypted</text>
  <g class="chip c1"><circle cx="690" cy="80" r="11" fill="#c4141f"/><text x="690" y="84" font-size="11" text-anchor="middle">🔓</text></g>
  <line x1="481" y1="108" x2="709" y2="108" stroke="#eceef2"/>
  <g font-size="13">
    <g class="m d1"><rect x="494" y="122" width="140" height="32" rx="16" fill="#eef0f4"/><text x="508" y="143" fill="#14231a">See you at 7?</text></g>
    <g class="m d2"><rect x="556" y="164" width="140" height="32" rx="16" fill="#7b4fe0"/><text x="570" y="185" fill="#fff">See you at 7 ✨</text></g>
    <g class="heart"><circle cx="690" cy="160" r="12" fill="#fff" stroke="#e3e5ec"/><text x="690" y="165" font-size="12" text-anchor="middle">❤️</text></g>
    <text class="floaty" x="680" y="190" font-size="15">❤️</text><text class="floaty b" x="660" y="196" font-size="12">💖</text><text class="floaty c" x="700" y="200" font-size="11">❤️</text>
    <g class="m d4"><rect x="494" y="212" width="190" height="80" rx="16" fill="#eef0f4"/>
      <text x="508" y="232" fill="#6b7280" font-size="10" font-weight="700" letter-spacing="1">POLL</text>
      <text x="508" y="250" fill="#14231a" font-weight="700">Pizza or tacos?</text>
      <rect x="508" y="260" width="162" height="20" rx="7" fill="#fff"/><rect class="bar" x="508" y="260" width="118" height="20" rx="7" fill="#c9b6f5"/>
      <text x="516" y="275" fill="#14231a" font-size="11">🌮 Tacos · 2 votes</text></g>
    <g class="m d5"><rect x="536" y="304" width="160" height="32" rx="16" fill="#7b4fe0"/><text x="550" y="325" fill="#fff">Tacos it is! 🎉</text></g>
  </g>
  <g>
    <rect class="bit" x="500" y="110" width="6" height="10" rx="2" fill="#ff5e7e"/><rect class="bit" x="540" y="110" width="6" height="10" rx="2" fill="#ffc531" style="animation-delay:4.7s"/>
    <rect class="bit" x="580" y="110" width="6" height="10" rx="2" fill="#2fa8ff" style="animation-delay:4.65s"/><rect class="bit" x="620" y="110" width="6" height="10" rx="2" fill="#1fc144" style="animation-delay:4.8s"/>
    <rect class="bit" x="660" y="110" width="6" height="10" rx="2" fill="#7b4fe0" style="animation-delay:4.75s"/><rect class="bit" x="690" y="110" width="6" height="10" rx="2" fill="#ff5e7e" style="animation-delay:4.85s"/>
  </g>
  <rect x="494" y="372" width="202" height="30" rx="15" fill="#f3f4f7"/><text x="508" y="392" fill="#9aa0ab" font-size="12">Text message</text>

  <!-- What you get -->
  <g font-size="14">
    <g class="chip c2" filter="url(#shadow)"><rect x="772" y="92" width="372" height="44" rx="14" fill="#fff"/><text x="790" y="119" fill="#14231a" font-weight="700">❤️ Real reactions, effects, polls, and games</text></g>
    <g class="chip c2" filter="url(#shadow)"><rect x="772" y="148" width="372" height="44" rx="14" fill="#fff"/><text x="790" y="175" fill="#14231a" font-weight="700">🎨 Your colors, your bubbles, your sounds</text></g>
    <g class="chip c3" filter="url(#shadow)"><rect x="772" y="204" width="372" height="44" rx="14" fill="#fff"/><text x="790" y="231" fill="#14231a" font-weight="700">🔒 A lock that tells you who can read it</text></g>
    <g class="chip c3" filter="url(#shadow)"><rect x="772" y="260" width="372" height="44" rx="14" fill="#fff"/><text x="790" y="287" fill="#14231a" font-weight="700">📦 Encrypted backups you control</text></g>
    <g class="chip c4" filter="url(#shadow)"><rect x="772" y="316" width="372" height="44" rx="14" fill="#fff"/><text x="790" y="343" fill="#14231a" font-weight="700">💻 Text from your computer, too</text></g>
  </g>
  <g class="chip c4"><text x="56" y="252" fill="#0f7a34" font-size="16" font-weight="700">No carrier deals. No sign-up.</text><text x="56" y="276" fill="#0f7a34" font-size="16" font-weight="700">Just your number, upgraded.</text></g>
</svg>
