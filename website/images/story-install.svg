<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Three steps to get it on an Android phone: download the file, open it and tap Install, then set it as your texting app.">
  <defs>
    <style>
      text { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .step { opacity: .35; animation: lit 9s ease-in-out infinite; }
      .s2 { animation-delay: 3s; } .s3 { animation-delay: 6s; }
      @keyframes lit { 0%, 30% { opacity: 1; } 36%, 100% { opacity: .35; } }
      .arrow { animation: drop 1.2s ease-in-out infinite alternate; }
      @keyframes drop { from { transform: translateY(-3px); } to { transform: translateY(3px); } }
      .ring { transform-box: fill-box; transform-origin: center; animation: tap 3s ease-out infinite; }
      @keyframes tap { 0%, 40% { opacity: 0; transform: scale(.4); } 50% { opacity: .9; } 70%, 100% { opacity: 0; transform: scale(1.5); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .step { opacity: 1 !important; } .ring { opacity: 0 !important; } }
    </style>
  </defs>
  <rect width="1200" height="260" rx="28" fill="#eef7f1"/>
  <g class="step">
    <circle cx="90" cy="70" r="24" fill="#1b9e45"/><text x="90" y="78" fill="#fff" font-size="22" font-weight="800" text-anchor="middle">1</text>
    <text x="130" y="66" fill="#14231a" font-size="22" font-weight="800">Download</text>
    <text x="130" y="92" fill="#3d4d43" font-size="15">Tap “Download for Android”.</text>
    <g transform="translate(150 120)"><rect width="180" height="90" rx="16" fill="#fff" stroke="#cfe6d6"/>
      <g class="arrow"><path d="M90 22 v32 m-13 -13 l13 13 l13 -13" fill="none" stroke="#1b9e45" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
      <rect x="60" y="66" width="60" height="6" rx="3" fill="#1b9e45" opacity=".4"/></g>
  </g>
  <g class="step s2">
    <circle cx="490" cy="70" r="24" fill="#1b9e45"/><text x="490" y="78" fill="#fff" font-size="22" font-weight="800" text-anchor="middle">2</text>
    <text x="530" y="66" fill="#14231a" font-size="22" font-weight="800">Install</text>
    <text x="530" y="92" fill="#3d4d43" font-size="15">Open the file, then tap Install.</text>
    <g transform="translate(550 120)"><rect width="180" height="90" rx="16" fill="#fff" stroke="#cfe6d6"/>
      <rect x="40" y="30" width="100" height="34" rx="17" fill="#1b9e45"/><text x="90" y="52" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">Install</text>
      <circle class="ring" cx="90" cy="47" r="20" fill="none" stroke="#1b9e45" stroke-width="3"/></g>
  </g>
  <g class="step s3">
    <circle cx="890" cy="70" r="24" fill="#1b9e45"/><text x="890" y="78" fill="#fff" font-size="22" font-weight="800" text-anchor="middle">3</text>
    <text x="930" y="66" fill="#14231a" font-size="22" font-weight="800">Make it yours</text>
    <text x="930" y="92" fill="#3d4d43" font-size="15">Pick your colors and set it as</text>
    <text x="930" y="112" fill="#3d4d43" font-size="15">your texting app.</text>
    <g transform="translate(950 126)"><rect width="180" height="90" rx="16" fill="#fff" stroke="#cfe6d6"/>
      <circle cx="44" cy="45" r="14" fill="#1b9e45"/><circle cx="78" cy="45" r="14" fill="#1f7fd6"/><circle cx="112" cy="45" r="14" fill="#7b4fe0"/><circle cx="146" cy="45" r="14" fill="#e0567a"/></g>
  </g>
</svg>
