<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Animated cards: a poll filling in, a tic-tac-toe move, a message slamming in with confetti, and invisible ink revealing">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1a14"/><stop offset="1" stop-color="#101828"/></linearGradient>
    <style>
      text { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .bar { transform-box: fill-box; transform-origin: left; animation: fill 6s ease-out infinite; }
      .b2 { animation-delay: .3s; }
      @keyframes fill { 0%, 8% { transform: scaleX(.05); } 30%, 100% { transform: scaleX(1); } }
      .move { transform-box: fill-box; transform-origin: center; animation: placed 6s cubic-bezier(.34, 1.6, .5, 1) infinite; }
      @keyframes placed { 0%, 35% { transform: scale(0); } 45%, 100% { transform: scale(1); } }
      .win { opacity: 0; animation: win 6s ease-out infinite; }
      @keyframes win { 0%, 50% { opacity: 0; } 60%, 92% { opacity: 1; } 100% { opacity: 0; } }
      .slam { transform-box: fill-box; transform-origin: center; animation: slam 6s cubic-bezier(.3, 1.4, .5, 1) infinite; }
      @keyframes slam { 0% { transform: scale(2.2); opacity: 0; } 10% { transform: scale(.92); opacity: 1; } 15%, 100% { transform: scale(1); opacity: 1; } }
      .ring { transform-box: fill-box; transform-origin: center; opacity: 0; animation: ring 6s ease-out infinite; }
      @keyframes ring { 0%, 8% { transform: scale(.3); opacity: 0; } 12% { opacity: .8; } 35%, 100% { transform: scale(1.6); opacity: 0; } }
      .bit { animation: fall 6s linear infinite; opacity: 0; }
      @keyframes fall { 0%, 9% { opacity: 0; transform: translateY(0) rotate(0); } 10% { opacity: 1; } 40% { opacity: 1; transform: translateY(190px) rotate(300deg); } 41%, 100% { opacity: 0; } }
      .ink { animation: ink 6s ease-in-out infinite; }
      @keyframes ink { 0%, 40% { opacity: .08; } 50%, 85% { opacity: 1; } 95%, 100% { opacity: .08; } }
      .dust { animation: dust 6s ease-in-out infinite; }
      @keyframes dust { 0%, 40% { opacity: 1; } 50%, 85% { opacity: 0; } 95%, 100% { opacity: 1; } }
      .twinkle circle { animation: tw 1.1s ease-in-out infinite alternate; }
      .twinkle circle:nth-child(3n) { animation-delay: -.4s; } .twinkle circle:nth-child(3n+1) { animation-delay: -.8s; }
      @keyframes tw { from { opacity: .2; } to { opacity: 1; } }
      .tap { opacity: 0; animation: tap 6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes tap { 0%, 36% { opacity: 0; transform: scale(.4); } 40% { opacity: .9; } 48%, 100% { opacity: 0; transform: scale(1.4); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .win, .ink, .move, .slam { opacity: 1 !important; transform: none !important; } .dust, .bit, .ring, .tap { opacity: 0 !important; } }
    </style>
  </defs>
  <rect width="1200" height="300" rx="28" fill="url(#bg)"/>

  <!-- Poll -->
  <g transform="translate(40 40)">
    <rect width="250" height="190" rx="22" fill="#1d2430"/>
    <text x="22" y="36" fill="#9aa3b2" font-size="11" font-weight="700" letter-spacing="1.5">POLL</text>
    <text x="22" y="62" fill="#fff" font-size="18" font-weight="700">Movie night?</text>
    <rect x="22" y="80" width="206" height="34" rx="10" fill="#273041"/>
    <rect class="bar" x="22" y="80" width="150" height="34" rx="10" fill="#1fc144" fill-opacity=".55"/>
    <text x="34" y="102" fill="#fff" font-size="14">✓ Friday</text><text x="216" y="102" fill="#fff" font-size="14" font-weight="700" text-anchor="end">4</text>
    <rect x="22" y="124" width="206" height="34" rx="10" fill="#273041"/>
    <rect class="bar b2" x="22" y="124" width="72" height="34" rx="10" fill="#9aa3b2" fill-opacity=".4"/>
    <text x="34" y="146" fill="#fff" font-size="14">Saturday</text><text x="216" y="146" fill="#fff" font-size="14" font-weight="700" text-anchor="end">2</text>
    <text x="125" y="250" fill="#c9d1dc" font-size="15" font-weight="600" text-anchor="middle">Polls</text>
  </g>

  <!-- Game -->
  <g transform="translate(330 40)">
    <rect width="250" height="190" rx="22" fill="#1d2430"/>
    <g transform="translate(62 22)" font-size="28" font-weight="800" text-anchor="middle">
      <rect x="0" y="0" width="40" height="40" rx="9" fill="#273041"/><rect x="46" y="0" width="40" height="40" rx="9" fill="#273041"/><rect x="92" y="0" width="40" height="40" rx="9" fill="#273041"/>
      <rect x="0" y="46" width="40" height="40" rx="9" fill="#273041"/><rect x="46" y="46" width="40" height="40" rx="9" fill="#273041"/><rect x="92" y="46" width="40" height="40" rx="9" fill="#273041"/>
      <rect x="0" y="92" width="40" height="40" rx="9" fill="#273041"/><rect x="46" y="92" width="40" height="40" rx="9" fill="#273041"/><rect x="92" y="92" width="40" height="40" rx="9" fill="#273041"/>
      <text x="20" y="30" fill="#ff6b6b">✕</text><text x="112" y="30" fill="#4dabf7">◯</text>
      <text x="66" y="76" fill="#ff6b6b">✕</text><text x="20" y="122" fill="#4dabf7">◯</text>
      <text class="move" x="112" y="122" fill="#ff6b6b">✕</text>
      <line class="win" x1="10" y1="10" x2="122" y2="122" stroke="#ffd43b" stroke-width="5" stroke-linecap="round"/>
    </g>
    <text x="125" y="176" fill="#9aa3b2" font-size="13" text-anchor="middle">Your move · tap a square</text>
    <text x="125" y="250" fill="#c9d1dc" font-size="15" font-weight="600" text-anchor="middle">Games</text>
  </g>

  <!-- Effect -->
  <g transform="translate(620 40)">
    <rect width="250" height="190" rx="22" fill="#1d2430"/>
    <circle class="ring" cx="125" cy="95" r="60" fill="none" stroke="#1fc144" stroke-width="3"/>
    <g class="slam"><rect x="45" y="74" width="160" height="42" rx="21" fill="#0f9a32"/><text x="125" y="101" fill="#fff" font-size="17" font-weight="600" text-anchor="middle">See you there!</text></g>
    <g>
      <rect class="bit" x="30" y="0" width="7" height="12" rx="2" fill="#ff5e7e"/><rect class="bit" x="70" y="0" width="7" height="12" rx="2" fill="#ffc531" style="animation-delay:.15s"/>
      <rect class="bit" x="110" y="0" width="7" height="12" rx="2" fill="#2fa8ff" style="animation-delay:.05s"/><rect class="bit" x="150" y="0" width="7" height="12" rx="2" fill="#1fc144" style="animation-delay:.2s"/>
      <rect class="bit" x="190" y="0" width="7" height="12" rx="2" fill="#ff5e7e" style="animation-delay:.1s"/><rect class="bit" x="220" y="0" width="7" height="12" rx="2" fill="#ffc531" style="animation-delay:.25s"/>
      <rect class="bit" x="50" y="0" width="7" height="12" rx="2" fill="#2fa8ff" style="animation-delay:.3s"/><rect class="bit" x="170" y="0" width="7" height="12" rx="2" fill="#ff5e7e" style="animation-delay:.35s"/>
    </g>
    <text x="125" y="250" fill="#c9d1dc" font-size="15" font-weight="600" text-anchor="middle">Effects</text>
  </g>

  <!-- Invisible ink -->
  <g transform="translate(910 40)">
    <rect width="250" height="190" rx="22" fill="#1d2430"/>
    <rect x="30" y="72" width="190" height="46" rx="23" fill="#2c3545"/>
    <text class="ink" x="125" y="101" fill="#fff" font-size="15" text-anchor="middle">The cake is a surprise 🤫</text>
    <g class="dust"><g class="twinkle" fill="#dfe6f0">
      <circle cx="52" cy="88" r="1.6"/><circle cx="66" cy="100" r="1.3"/><circle cx="80" cy="90" r="1.7"/><circle cx="94" cy="104" r="1.3"/><circle cx="108" cy="86" r="1.5"/>
      <circle cx="122" cy="99" r="1.8"/><circle cx="136" cy="89" r="1.3"/><circle cx="150" cy="103" r="1.6"/><circle cx="164" cy="91" r="1.4"/><circle cx="178" cy="101" r="1.7"/>
      <circle cx="192" cy="88" r="1.3"/><circle cx="200" cy="102" r="1.5"/><circle cx="58" cy="106" r="1.2"/><circle cx="116" cy="108" r="1.2"/><circle cx="172" cy="84" r="1.2"/>
    </g></g>
    <circle class="tap" cx="150" cy="95" r="18" fill="#fff" fill-opacity=".35"/>
    <text x="125" y="160" fill="#9aa3b2" font-size="13" text-anchor="middle">Hidden until tapped</text>
    <text x="125" y="250" fill="#c9d1dc" font-size="15" font-weight="600" text-anchor="middle">Invisible ink</text>
  </g>
</svg>
