<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="The problem: a plain, gray texting app. A heart arrives as the sentence Loved “See you at 7”, and around it pop up the problems: reactions as sentences, the newer text features depend on your carrier and app, every app looks the same, no idea who can read it, lose your phone and lose your texts, and no way to text from your computer.">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".16"/></filter>
    <style>
      text { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .m { opacity: 0; animation: in 12s ease-out infinite; }
      .d1 { animation-delay: .2s; } .d2 { animation-delay: .9s; } .d3 { animation-delay: 1.6s; }
      @keyframes in { 0% { opacity: 0; transform: translateY(8px); } 4%, 92% { opacity: 1; transform: none; } 98%, 100% { opacity: 0; } }
      .p { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop 12s cubic-bezier(.34, 1.5, .5, 1) infinite; }
      .p1 { animation-delay: 2.4s; } .p2 { animation-delay: 3.4s; } .p3 { animation-delay: 4.4s; } .p4 { animation-delay: 5.4s; } .p5 { animation-delay: 6.4s; } .p6 { animation-delay: 7.4s; }
      @keyframes pop { 0% { opacity: 0; transform: scale(.6); } 4%, 80% { opacity: 1; transform: scale(1); } 88%, 100% { opacity: 0; transform: scale(1); } }
      .shrug { opacity: 0; animation: in 12s ease-out infinite; animation-delay: 1.8s; }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .m, .p, .shrug { opacity: 1 !important; } }
    </style>
  </defs>
  <rect width="1200" height="460" rx="28" fill="#f3f1ef"/>

  <text x="56" y="70" fill="#8a3a2e" font-size="15" font-weight="800" letter-spacing="2">THE PROBLEM</text>
  <text x="56" y="114" fill="#231a17" font-size="36" font-weight="800">Regular texting</text>
  <text x="56" y="156" fill="#231a17" font-size="36" font-weight="800">is stuck in the past.</text>

  <!-- A plain, dated texting app -->
  <g filter="url(#shadow)">
    <rect x="470" y="40" width="250" height="390" rx="34" fill="#2a2a2e"/>
    <rect x="481" y="54" width="228" height="362" rx="26" fill="#ececec"/>
  </g>
  <rect x="481" y="54" width="228" height="52" rx="0" fill="#d9d9d9"/>
  <text x="500" y="86" fill="#444" font-size="15" font-weight="700">Sam</text>
  <text x="702" y="86" fill="#777" font-size="12" text-anchor="end">Text message</text>
  <g font-size="13">
    <g class="m d1"><rect x="494" y="124" width="150" height="34" rx="6" fill="#fff" stroke="#c9c9c9"/><text x="506" y="146" fill="#333">See you at 7?</text></g>
    <g class="m d2"><rect x="546" y="170" width="150" height="34" rx="6" fill="#b9b9b9"/><text x="558" y="192" fill="#222">See you at 7</text></g>
    <g class="m d3"><rect x="494" y="216" width="200" height="50" rx="6" fill="#fff" stroke="#c9c9c9"/><text x="506" y="237" fill="#333">Loved “See you at 7”</text><text x="506" y="255" fill="#999" font-size="11">from Sam's iPhone</text></g>
  </g>
  <g class="shrug"><text x="595" y="312" fill="#8b8b8b" font-size="13" text-anchor="middle">🔓 Who can read this? 🤷</text></g>
  <rect x="494" y="372" width="202" height="30" rx="4" fill="#fff" stroke="#c9c9c9"/><text x="506" y="392" fill="#aaa" font-size="12">Type a message</text>

  <!-- The problems -->
  <g font-size="14">
    <g class="p p1" filter="url(#shadow)"><rect x="56" y="200" width="372" height="44" rx="14" fill="#fff"/><text x="74" y="227" fill="#231a17"><tspan font-weight="700">💬 Reactions arrive as sentences</tspan></text></g>
    <g class="p p2" filter="url(#shadow)"><rect x="56" y="256" width="372" height="44" rx="14" fill="#fff"/><text x="74" y="283" fill="#231a17"><tspan font-weight="700">📶 Newer features depend on your carrier</tspan></text></g>
    <g class="p p3" filter="url(#shadow)"><rect x="56" y="312" width="372" height="44" rx="14" fill="#fff"/><text x="74" y="339" fill="#231a17"><tspan font-weight="700">🎨 Plain, gray, and the same for everyone</tspan></text></g>
    <g class="p p4" filter="url(#shadow)"><rect x="772" y="122" width="372" height="44" rx="14" fill="#fff"/><text x="790" y="149" fill="#231a17"><tspan font-weight="700">🔍 No idea who can read your messages</tspan></text></g>
    <g class="p p5" filter="url(#shadow)"><rect x="772" y="178" width="372" height="44" rx="14" fill="#fff"/><text x="790" y="205" fill="#231a17"><tspan font-weight="700">📦 Lose your phone, lose your texts</tspan></text></g>
    <g class="p p6" filter="url(#shadow)"><rect x="772" y="234" width="372" height="44" rx="14" fill="#fff"/><text x="790" y="261" fill="#231a17"><tspan font-weight="700">💻 No way to text from your computer</tspan></text></g>
  </g>
  <text x="958" y="330" fill="#8a3a2e" font-size="17" font-weight="700" text-anchor="middle" class="shrug">iPhone has had better</text>
  <text x="958" y="354" fill="#8a3a2e" font-size="17" font-weight="700" text-anchor="middle" class="shrug">for years. Why don't we?</text>
</svg>
