plugins {
    id 'com.android.application' version '8.9.2'
    id 'org.jetbrains.kotlin.android' version '2.1.20'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.1.20'
}
android {
    namespace 'org.fluidmessages'
    compileSdk 35
    defaultConfig {
        applicationId 'org.fluidmessages'
        minSdk 33
        targetSdk 35
        versionCode 58
        versionName '0.47.1'
        // F-Droid builds (./gradlew assembleRelease -Pfdroid=true) leave updates to F-Droid: no update checks or downloads.
        buildConfigField 'boolean', 'FDROID', String.valueOf(project.findProperty('fdroid') == 'true')
    }
    buildFeatures { compose true; buildConfig true }
    // The dependency list AGP adds to the signing block is encrypted for Google Play only; F-Droid rejects it.
    dependenciesInfo { includeInApk = false; includeInBundle = false }
    // The call screen runs the same WebRTC code as the browser companion.
    sourceSets { main { assets.srcDirs += ['../server/shared'] } }
    packaging {
        resources { excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES', 'META-INF/*.md', 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'] }
        // Tor is about 8.5 MB per processor type. Compressed in the APK, they cost about 4 MB each to download instead
        // of 8.5, and the phone unpacks only its own one when installing. 32-bit x86 is left out: no Android 13 phone
        // uses it (emulators are x86_64), and there Connect through Tor says to use the Orbot app instead.
        jniLibs {
            useLegacyPackaging = true
            excludes += ['lib/x86/libtor.so']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Java 17 bytecode, built with whichever JDK runs Gradle (17 or newer). No toolchain is required, so builders with
// only a newer JDK, like F-Droid's build server, work too.
kotlin { compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 } }

// Android ships its own XmlPullParser, which Smack uses; the desktop copies would clash.
configurations.configureEach { exclude group: 'xpp3' }

dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation platform('androidx.compose:compose-bom:2025.05.01')
    implementation 'androidx.compose.material3:material3'
    // Removes document information and XMP from PDFs before sending (Apache-2.0).
    // BouncyCastle only serves encrypted PDFs, which are sent unchanged, so it stays out of the APK.
    implementation('com.tom-roush:pdfbox-android:2.0.27.0') { exclude group: 'org.bouncycastle' }
    // Connecting from the phone: Email (JavaMail for Android) and XMPP (Smack).
    implementation 'com.sun.mail:android-mail:1.6.8'
    implementation 'com.sun.mail:android-activation:1.6.8'
    implementation 'org.igniterealtime.smack:smack-android-extensions:4.4.8'
    implementation 'org.igniterealtime.smack:smack-tcp:4.4.8'
    // OMEMO on the phone (OmemoCore.java) uses its X25519 and Ed25519 (Bouncy Castle License, MIT-style). Smack's
    // OpenPGP support already brings this same version into the APK; it's named here so OMEMO doesn't rely on that.
    implementation 'org.bouncycastle:bcprov-jdk15on:1.65'
    // Backups to file servers: SFTP (JSch) and FTP/FTPS (Apache Commons Net). WebDAV uses Android's own HTTPS.
    implementation 'com.github.mwiede:jsch:2.28.8'
    implementation 'commons-net:commons-net:3.13.0'
    // Scanning FluidMessages Web's pairing QR code: CameraX for the camera, ZXing core to read the code (also makes and reads Nearby codes) (both Apache-2.0).
    // No Google Play services or ML Kit.
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'com.google.zxing:core:3.5.3'
    // Connect through Tor runs Tor inside the app (BuiltInTor): Guardian Project's tor-android, BSD-3-Clause, which
    // brings jtorctl 0.4.5.7 (BSD-3-Clause) for Tor's control connection. Tor for arm64-v8a, armeabi-v7a, x86, and
    // x86_64. 0.4.8.22 is the newest that builds with compileSdk 35: 0.4.9.x needs compileSdk 37 and a newer Android
    // Gradle plugin. Its Kotlin standard library is left out: TorService is Java, and the app brings its own.
    // F-Droid builds leave the prebuilt Tor program out (F-Droid builds everything from source): there,
    // BuiltInTor.supported() is false and Connect through Tor uses the Orbot app instead.
    if (project.findProperty('fdroid') == 'true') {
        implementation 'info.guardianproject:jtorctl:0.4.5.7'
        implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    } else {
        implementation('info.guardianproject:tor-android:0.4.8.22') { exclude group: 'org.jetbrains.kotlin' }
    }
    testImplementation 'junit:junit:4.13.2'
}
