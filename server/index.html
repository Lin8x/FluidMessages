<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FluidMessages</title>
<link rel="icon" type="image/webp" href="/icon.webp">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#3bb85f">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/style.css">
<script src="/call.js" defer></script>
<script src="/app.js" defer></script>
<script src="/companion.js" defer></script>
</head>
<body>
<header class="topbar">
  <span class="brand"><img class="brand-mark" src="/icon.webp" alt="" width="28" height="28">FluidMessages</span>
  <span id="status" class="status" role="status">Disconnected</span>
  <button id="open-queue" type="button" hidden>Scheduled</button>
  <button id="disconnect" type="button" hidden>Disconnect</button>
</header>
<main>
  <form id="pair" class="pair">
    <img class="app-icon" src="/icon.webp" alt="FluidMessages icon" width="96" height="96">
    <h1>Messages on the web</h1>
    <p>Sign in with your server’s access token (FLUID_TOKEN). Matrix, XMPP, Email, and IRC work here on their own; texts go through your Android phone once it’s connected.</p>
    <label>Access token<input id="token" type="password" required autocomplete="off"></label>
    <label class="remember"><input id="remember" type="checkbox"> Keep me signed in on this browser</label>
    <button class="primary">Connect</button>
    <p id="pair-error" role="alert"></p>
  </form>
  <section id="workspace" class="workspace" hidden>
    <aside class="sidebar" aria-label="Inbox">
      <div class="sidebar-head">
        <h1>Messages</h1>
        <select id="folder" aria-label="Inbox filter">
          <option>Inbox</option><option>Archived</option><option>Blocked</option>
        </select>
      </div>
      <nav id="threads" aria-label="Conversations"></nav>
      <div class="search-dock">
        <input id="search" type="search" placeholder="Search" aria-label="Search conversations">
        <button id="new" class="icon-button" type="button" aria-label="New SMS" title="New SMS">＋</button>
      </div>
    </aside>
    <article class="thread-pane">
      <div class="thread-head">
        <button id="back" class="icon-button" type="button" aria-label="Back to messages">‹</button>
        <span id="avatar" class="avatar" aria-hidden="true"></span>
        <div><h2 id="recipient">Messages</h2><span id="transport"></span></div>
        <button id="call" class="call-button" type="button" hidden title="Call from your phone">Call</button>
      </div>
      <div id="conversation" aria-label="Messages" tabindex="0"></div>
      <p id="readonly" class="readonly" role="status" hidden></p>
      <form id="schedule" class="composer" hidden>
        <label id="address-field">To<input id="address" type="tel" required placeholder="Phone number"></label>
        <div id="reply" class="quote composer-reply" hidden>
          <span id="reply-text"></span><button id="cancel-reply" type="button" aria-label="Clear reply">×</button>
        </div>
        <div class="compose-row">
          <textarea id="body" maxlength="1600" required rows="2" placeholder="Text message" aria-label="Message"></textarea>
          <button class="primary" id="send">Send SMS</button>
        </div>
        <details id="later"><summary>Send later</summary>
          <label>Send after<input id="due" type="datetime-local"></label>
        </details>
        <p id="schedule-status" role="status"></p>
      </form>
    </article>
  </section>
</main>
<dialog id="queue" aria-labelledby="queue-title">
  <div class="sidebar-head"><h2 id="queue-title">Scheduled messages</h2><button id="close-queue" type="button">Done</button></div>
  <div id="jobs"></div>
  <p id="queue-status" role="status"></p>
</dialog>
</body>
</html>
